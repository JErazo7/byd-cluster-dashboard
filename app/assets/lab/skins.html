<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SharkLab · paneles</title>
<style>
  :root { --bg:#070b11; --panel:#0f1720; --line:#1d2937; --fg:#e6eef6; --dim:#7f8c9b; --acc:#38cfff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  header .sp { flex: 1; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
           padding: 10px 14px; font-size: 14px; cursor: pointer; }
  button.primary { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 520px; height: calc(100vh - 58px); }
  #list { overflow: auto; padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .card[aria-current=true] { border-color: var(--acc); }
  .card img { display: block; width: 100%; aspect-ratio: 8 / 3; object-fit: cover; background: #04070c; }
  .card .n { padding: 8px 10px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .n small { color: var(--dim); font-size: 11px; }
  #side { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #side .head { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  #side .head b { font-size: 14px; }
  #frameWrap { flex: 1; position: relative; background: #04070c; overflow: hidden; }
  #frame { position: absolute; left: 50%; top: 50%; width: 1280px; height: 480px; border: 0;
           transform-origin: 50% 50%; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <button onclick="Lab.openSkin()">◀ VOLVER AL PANEL</button>
  <h1>Paneles</h1>
  <div class="sp"></div>
  <span class="hint" id="count"></span>
</header>
<main>
  <div id="list"><div class="grid" id="grid"><div class="hint">cargando…</div></div></div>
  <aside id="side">
    <div class="head">
      <b id="sel">—</b>
      <div class="sp" style="flex:1"></div>
      <button class="primary" id="apply">APLICAR</button>
    </div>
    <div id="frameWrap"><iframe id="frame" scrolling="no"></iframe></div>
  </aside>
</main>
<script>
(function () {
  'use strict';
  var L = window.Lab || {};
  var list = [];
  var current = (L.currentSkin && L.currentSkin()) || '';
  var picked = current || '';

  function scaleFrame() {
    var w = document.getElementById('frameWrap').clientWidth;
    var h = document.getElementById('frameWrap').clientHeight;
    var k = Math.min(w / 1280, h / 480);
    var f = document.getElementById('frame');
    f.style.transform = 'translate(-50%, -50%) scale(' + k.toFixed(4) + ')';
  }
  window.addEventListener('resize', scaleFrame);

  function preview(id) {
    picked = id;
    document.getElementById('sel').textContent = id;
    [].forEach.call(document.querySelectorAll('.card'), function (c) {
      c.setAttribute('aria-current', c.dataset.id === id ? 'true' : 'false');
    });
    var f = document.getElementById('frame');
    f.src = (L.skinUrl ? L.skinUrl(id) : '../dash/' + id + '/index.html') + '#lab=1&panel=1&fit=cover&lang=es';
    scaleFrame();
  }

  function build() {
    var g = document.getElementById('grid');
    g.innerHTML = '';
    document.getElementById('count').textContent = list.length + ' paneles';
    if (!list.length) { g.innerHTML = '<div class="hint">ningún panel instalado</div>'; return; }
    list.forEach(function (id) {
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.setAttribute('aria-current', id === picked ? 'true' : 'false');
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.src = L.thumbUrl ? L.thumbUrl(id) : '../dash/' + id + '/thumb.jpg';
      img.alt = id;
      var n = document.createElement('div');
      n.className = 'n';
      var b = document.createElement('span');
      b.textContent = L.skinName ? (L.skinName(id) || id) : id;
      var s = document.createElement('small');
      s.textContent = id === current ? 'en uso' : '';
      n.appendChild(b); n.appendChild(s);
      card.appendChild(img); card.appendChild(n);
      card.addEventListener('click', function () { preview(id); });
      g.appendChild(card);
    });
  }

  document.getElementById('apply').addEventListener('click', function () {
    if (!picked) return;
    if (L.applySkin) L.applySkin(picked);
    current = picked;
    build();
  });

  try { list = JSON.parse(L.skins ? L.skins() : '[]'); } catch (e) { list = []; }
  build();
  if (picked) preview(picked);
  setTimeout(scaleFrame, 200);
})();
</script>
</body>
</html>
