<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SharkLab</title>
<style>
  :root { --bg:#05080d; --panel:#0d151e; --line:#1e2b38; --fg:#e8eef5; --dim:#7f8c9b; --acc:#38cfff; --good:#37e07a; --warm:#ffb020; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(120% 90% at 50% 0%, #0d1a26 0%, var(--bg) 60%);
         color: var(--fg); font: 16px/1.4 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .wrap { width: min(1100px, 94vw); }
  h1 { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin: 0 0 18px; text-align: center; }
  .start { display: block; margin: 0 auto 26px; width: 260px; height: 260px; border-radius: 50%;
           border: 2px solid #1f3d52; background: radial-gradient(circle at 50% 40%, #10222f, #070d13 70%);
           color: var(--fg); font-size: 26px; font-weight: 600; letter-spacing: .12em; cursor: pointer;
           box-shadow: 0 0 0 0 rgba(56,207,255,.4); transition: box-shadow .4s, transform .15s; }
  .start:active { transform: scale(.98); }
  .start.on { border-color: var(--good); color: var(--good); box-shadow: 0 0 60px rgba(55,224,122,.25); }
  .start .sub { display: block; font-size: 13px; letter-spacing: .08em; color: var(--dim); margin-top: 8px; font-weight: 400; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .card small { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .card b { font-size: 22px; font-weight: 600; }
  .card button { margin-top: 12px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
                 background: #111c26; color: var(--fg); font-size: 15px; cursor: pointer; }
  .card button:active { border-color: var(--acc); color: var(--acc); }
  .gear { position: fixed; right: 14px; bottom: 14px; width: 46px; height: 46px; border-radius: 50%;
          background: rgba(20,30,42,.6); border: 1px solid var(--line); color: var(--dim); font-size: 18px; cursor: pointer; }
  .panel-sel { position: fixed; inset: 0; background: rgba(4,7,11,.94); display: none; padding: 26px; overflow: auto; }
  .panel-sel.show { display: block; }
  .panel-sel h2 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .item[aria-current=true] { border-color: var(--acc); }
  .item img { width: 100%; aspect-ratio: 8/3; object-fit: cover; display: block; background: #04070c; }
  .item span { display: block; padding: 8px 10px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SharkLab</h1>
  <button class="start" id="start">ENCENDER<span class="sub" id="startSub">tocar para arrancar</span></button>
  <div class="cards">
    <div class="card">
      <small>Tema actual</small>
      <b id="themeName">—</b>
      <button id="themeBtn">ELEGIR TEMA</button>
    </div>
    <div class="card">
      <small>Sonido del vehículo</small>
      <b id="engineName">—</b>
      <button id="engineBtn">CAMBIAR SONIDO</button>
    </div>
  </div>
</div>
<button class="gear" id="gear">⚙</button>

<div class="panel-sel" id="themePanel">
  <h2>Elegí tu tema</h2>
  <div class="grid" id="themeGrid"></div>
</div>
<div class="panel-sel" id="enginePanel">
  <h2>Sonido del vehículo</h2>
  <div class="grid" id="engineGrid"></div>
</div>

<script>
(function () {
  'use strict';
  var L = window.Lab || {};
  var started = false;

  function $(id) { return document.getElementById(id); }

  /* --- estado inicial --- */
  function themeName() {
    var id = L.currentSkin ? L.currentSkin() : 'muscle';
    return id;
  }
  function refresh() {
    $('themeName').textContent = themeName();
    var e = window.EngineApp;
    $('engineName').textContent = e ? (e.list()[e.index()] || {}).name || '—' : '—';
    $('start').classList.toggle('on', started);
    $('startSub').textContent = started ? 'encendido · tocá para apagar' : 'tocar para arrancar';
    $('start').firstChild.textContent = started ? 'APAGAR' : 'ENCENDER';
  }

  /* --- encender --- */
  $('start').addEventListener('click', function () {
    started = !started;
    if (started) {
      if (L.ignite) L.ignite();            /* painel: varredura de arranque */
      if (window.EngineApp) {
        window.EngineApp.start();
        window.EngineApp.mute(false);
      }
    } else {
      if (window.EngineApp) window.EngineApp.mute(true);
    }
    refresh();
  });

  /* --- temas --- */
  function openThemes() {
    var grid = $('themeGrid');
    grid.innerHTML = '';
    var list = [];
    try { list = JSON.parse(L.skins ? L.skins() : '[]'); } catch (e) {}
    var cur = L.currentSkin ? L.currentSkin() : '';
    list.forEach(function (id) {
      var d = document.createElement('div');
      d.className = 'item';
      d.setAttribute('aria-current', id === cur ? 'true' : 'false');
      var img = document.createElement('img');
      img.src = L.thumbUrl ? L.thumbUrl(id) : '../dash/' + id + '/thumb.jpg';
      var s = document.createElement('span');
      s.textContent = id;
      d.appendChild(img); d.appendChild(s);
      d.addEventListener('click', function () {
        if (L.overlayReload) L.overlayReload(id);
        else if (L.applySkin) L.applySkin(id);
        $('themePanel').classList.remove('show');
        setTimeout(refresh, 400);
      });
      grid.appendChild(d);
    });
    $('themePanel').classList.add('show');
  }
  $('themeBtn').addEventListener('click', openThemes);
  $('themePanel').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  /* --- motores --- */
  function openEngines() {
    var grid = $('engineGrid');
    grid.innerHTML = '';
    var e = window.EngineApp;
    if (!e) { grid.textContent = 'motor no disponible'; }
    else {
      e.list().forEach(function (en, i) {
        var d = document.createElement('div');
        d.className = 'item';
        d.setAttribute('aria-current', e.index() === i ? 'true' : 'false');
        var s = document.createElement('span');
        s.textContent = en.name;
        d.appendChild(s);
        d.style.padding = '16px';
        d.addEventListener('click', function () {
          e.start();
          e.select(i);
          $('enginePanel').classList.remove('show');
          setTimeout(refresh, 200);
        });
        grid.appendChild(d);
      });
    }
    $('enginePanel').classList.add('show');
  }
  $('engineBtn').addEventListener('click', openEngines);
  $('enginePanel').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  /* --- avanzado (menú oculto) --- */
  $('gear').addEventListener('click', function () {
    if (L.openAdvanced) L.openAdvanced();
  });

  refresh();
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
