<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SharkLab</title>
<style>
  :root { --bg:#05080d; --panel:#0d151e; --line:#1e2b38; --fg:#e8eef5; --dim:#7f8c9b;
          --acc:#38cfff; --good:#37e07a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; color: var(--fg); font: 16px/1.4 system-ui, sans-serif;
         background: radial-gradient(120% 90% at 50% 0%, #0d1a26 0%, var(--bg) 60%);
         display: flex; align-items: center; justify-content: center; }
  .wrap { width: min(1200px, 90vw); padding: 24px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          overflow: hidden; cursor: pointer; }
  .item[aria-current=true] { border-color: var(--acc); }
  .item img { width: 100%; aspect-ratio: 8/3; object-fit: cover; display: block; background: #04070c; }
  .item span { display: block; padding: 10px 12px; font-size: 15px; letter-spacing: .06em;
               text-transform: uppercase; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px;
         margin-top: 22px; padding: 16px 18px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 14px; }
  .row small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
               color: var(--dim); }
  .apply { width: 100%; margin-top: 14px; padding: 20px; border-radius: 16px;
           border: 1px solid #1f3d52; background: #101a24; color: var(--fg);
           font-size: 19px; font-weight: 600; letter-spacing: .14em; cursor: pointer; }
  .apply.on { border-color: var(--good); color: var(--good); }
  .apply:active { transform: scale(.995); }
  .sub { margin-top: 10px; font-size: 13px; color: var(--dim); text-align: center; min-height: 18px; }
  /* switch */
  .sw { position: relative; width: 62px; height: 34px; flex: none; border-radius: 999px;
        border: 1px solid var(--line); background: #0a1219; cursor: pointer; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
               border-radius: 50%; background: #46586a; transition: left .18s, background .18s; }
  .sw[aria-pressed=true] { border-color: var(--good); }
  .sw[aria-pressed=true]::after { left: 31px; background: var(--good); }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid" id="grid"></div>

  <button class="apply" id="apply">APLICAR</button>
  <div class="sub" id="sub"></div>

  <div class="row" id="autoRow">
    <div>
      <small>Iniciar automáticamente</small>
      <span style="color:var(--dim);font-size:13px">aplica el tema al encender el auto</span>
    </div>
    <div class="sw" id="auto" role="switch" aria-pressed="false" aria-label="Iniciar automáticamente"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var L = window.Lab || {};
  var applied = L.panelApplied ? !!L.panelApplied() : false;

  function $(id) { return document.getElementById(id); }

  function paint() {
    $('apply').textContent = applied ? 'DESACTIVAR' : 'APLICAR';
    $('apply').classList.toggle('on', applied);
    $('sub').textContent = applied ? 'aplicado en el panel' : '';
  }

  function grid() {
    var list = [];
    try { list = JSON.parse(L.skins ? L.skins() : '[]'); } catch (e) {}
    var cur = L.currentSkin ? L.currentSkin() : '';
    var g = $('grid');
    g.innerHTML = '';
    list.forEach(function (id) {
      var d = document.createElement('div');
      d.className = 'item';
      d.setAttribute('aria-current', id === cur ? 'true' : 'false');
      var img = document.createElement('img');
      img.src = L.thumbUrl ? L.thumbUrl(id) : '../dash/' + id + '/thumb.jpg';
      img.alt = id;
      var s = document.createElement('span');
      s.textContent = id;
      d.appendChild(img); d.appendChild(s);
      d.addEventListener('click', function () {
        if (L.overlayReload) L.overlayReload(id);
        setTimeout(function () { grid(); paint(); }, 300);
      });
      g.appendChild(d);
    });
  }

  $('apply').addEventListener('click', function () {
    if (!applied) {
      if (L.ignite) L.ignite();
      if (L.overlayShow) L.overlayShow();
      applied = true;
    } else {
      if (L.panelRelease) L.panelRelease();
      applied = false;
    }
    paint();
  });

  var sw = $('auto');
  function paintAuto() {
    var on = L.bootApplyGet ? !!L.bootApplyGet() : false;
    sw.setAttribute('aria-pressed', String(on));
    document.querySelector('.row span').textContent = on
      ? 'aplica el tema al encender el auto'
      : 'el panel queda con el diseño de BYD al encender';
  }
  $('autoRow').addEventListener('click', function () {
    var on = !(L.bootApplyGet ? !!L.bootApplyGet() : false);
    if (L.bootApplySet) L.bootApplySet(on);
    paintAuto();
  });

  grid();
  paintAuto();
  paint();
})();
</script>
</body>
</html>
