<!DOCTYPE html>
<!-- Preview of the skins outside the car: opens in the browser of the PC or the phone and drives the
     controls. The values go to the same function the app calls (window.BrasaDriveUpdate). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharkLab · theme preview</title>
<style>
  body { margin: 0; background: #0b1016; color: #cfd8e3; font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 12px; align-items: flex-end; border-bottom: 1px solid #1d2733; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #7f8c9b; }
  input[type=range] { width: 118px; }
  select, button { background: #16202b; color: #cfd8e3; border: 1px solid #26333f; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  #fit { position: relative; overflow: hidden; }
  .stage { position: relative; width: 1920px; height: 720px; transform-origin: 0 0; background: #04070c;
           background-image: linear-gradient(#101820, #1d2a38); outline: 1px solid #1d2733; }
  .stage iframe { width: 1920px; height: 720px; border: 0; display: block; }
  .notch { position: absolute; left: 700px; top: 0; width: 520px; height: 60px; background: #243244; opacity: .9; }
  .notch span { display: block; margin: 16px 0 0 10px; font-size: 11px; color: #7f8c9b; }
  .hide { display: none; }
  code { color: #8fd6ff; }
  @media (max-width: 700px) { header { gap: 8px; } input[type=range] { width: 88px; } }
</style>
</head>
<body>
<header>
  <label>Theme <select id="theme">
    <option value="byd" selected>byd</option>
  </select></label>
  <label>Speed <input id="speed" type="range" min="0" max="220" value="87"><span id="speedV">87</span></label>
  <label>Power kW <input id="pw" type="range" min="-120" max="220" value="64"><span id="pwV">64</span></label>
  <label>Battery % <input id="soc" type="range" min="0" max="100" value="68"><span id="socV">68</span></label>
  <label>Fuel km <input id="fuelKm" type="range" min="0" max="950" step="10" value="640"><span id="fuelKmV">640</span></label>
  <label>Pedal % <input id="tps" type="range" min="0" max="100" value="34"><span id="tpsV">34</span></label>
  <label>Drivetrain <select id="ev"><option value="">—</option><option value="1" selected>EV</option><option value="0">HEV</option></select></label>
  <label>Gear <select id="sel"><option>P</option><option>R</option><option>N</option><option selected>D</option></select></label>
  <label>P FL <input id="tfl" type="range" min="1.5" max="3.5" step="0.1" value="2.5"><span id="tflV">2.5</span></label>
  <label>P FR <input id="tfr" type="range" min="1.5" max="3.5" step="0.1" value="2.4"><span id="tfrV">2.4</span></label>
  <label>P RL <input id="trl" type="range" min="1.5" max="3.5" step="0.1" value="2.6"><span id="trlV">2.6</span></label>
  <label>P RR <input id="trr" type="range" min="1.5" max="3.5" step="0.1" value="2.5"><span id="trrV">2.5</span></label>
  <label>Mode <select id="drive"><option>ECO</option><option selected>NORMAL</option><option>MONTAÑA</option><option>NIEVE</option><option>ARENA</option><option>LODO</option><option>SPORT</option></select></label>
  <label>Indicators <select id="turn"><option value="0">none</option><option value="1">left</option><option value="2">right</option></select></label>
  <label>Parameters (shark) <select id="variant">
    <option value="">dark</option><option value="#light=1">light</option>
    <option value="#panel=1&full=1">full panel</option><option value="#wide=1720">width 1720</option>
  </select></label>
  <label><input id="notchOn" type="checkbox"> BYD light band</label>
</header>
<div id="fit">
  <div class="stage" id="stage">
    <iframe id="f" src="dash/byd/index.html#nopreview=1&full=1&panel=1"></iframe>
    <div class="notch hide" id="notch"><span>BYD lights (x 427–853, y 0–54)</span></div>
  </div>
</div>
<script>
(function () {
  var f = document.getElementById('f'), $ = function (id) { return document.getElementById(id); };
  var booted = false;
  f.addEventListener('load', function () { booted = true; feed(); });

  /* the theme does not read `drive`: what moves it are the car signals, `surfmode` (terrain) and
     `ecoind`/`opmode` (driving mode). The selectors are mapped to those codes. */
  var MODE_SIGNAL = {
    'ECO':     { opmode: 1, ecoind: 8353,   surfmode: 0 },
    'NORMAL':  { opmode: 1, ecoind: 135298, surfmode: 0 },
    'SPORT':   { opmode: 2, ecoind: 10306,  surfmode: 0 },
    'MONTAÑA': { opmode: 1, ecoind: 135298, surfmode: 5 },
    'NIEVE':   { opmode: 1, ecoind: 135298, surfmode: 2 },
    'ARENA':   { opmode: 1, ecoind: 135298, surfmode: 4 },
    'LODO':    { opmode: 1, ecoind: 135298, surfmode: 3 }
  };

  function feed() {
    if (!booted || !f.contentWindow || !f.contentWindow.BrasaDriveUpdate) return;
    var turn = $('turn').value;
    var mode = $('drive').value, sig = MODE_SIGNAL[mode] || MODE_SIGNAL.NORMAL;
    f.contentWindow.EvsPU = 1; f.contentWindow.EvsDU = 1; f.contentWindow.EvsSU = 1;
    f.contentWindow.BrasaDriveUpdate({
      speed: +$('speed').value, rpm: 1800, gear: '3', tps: +$('tps').value, map: 1.2, boostBar: 0,
      soc: +$('soc').value, fuelKm: +$('fuelKm').value,
      fuel: Math.round(+$('fuelKm').value / 950 * 100), lambda: 1, brake: 0,
      turnLeft: turn === '1' ? 1 : 0, turnRight: turn === '2' ? 1 : 0,
      on: true, sel: $('sel').value, ev: $('ev').value === '' ? null : +$('ev').value, car: 'V8', pw: +$('pw').value, odo: 12843, range: 412, tout: 24, btemp: 32,
      dmode: 2, drive: mode, opmode: sig.opmode, ecoind: sig.ecoind, surfmode: sig.surfmode,
      ready: 1, regen: 0, v12: 13.8, phone: -1, tt: {}, rhd: false, warn: [],
      adas: {}, tyre: { fl: +$('tfl').value, fr: +$('tfr').value, rl: +$('trl').value, rr: +$('trr').value }, cam: null,
      nmv: { text: 'Gire a la derecha en 200 m' }, ext: null, trip: { km: 12.4 },
      media: { title: 'Highway to Hell', artist: 'AC/DC' }
    });
  }

  /* ?skin=byd&variant=... opens straight into a theme (handy on the phone, bookmark) */
  var q = new URLSearchParams(location.search);
  if (q.get('skin')) {
    var opt = document.createElement('option');
    opt.value = q.get('skin');
    if (!document.querySelector('#theme option[value="' + opt.value + '"]')) $('theme').appendChild(opt);
    $('theme').value = q.get('skin');
  }
  if (q.get('variant')) $('variant').value = q.get('variant');

  function load() {
    booted = false;
    var v = $('variant').value;
    f.src = 'dash/' + $('theme').value + '/index.html' + (v ? v : '#nopreview=1') + (v ? '&' : '') + 'v=' + Date.now();
  }

  ['speed', 'pw', 'soc', 'fuelKm', 'tps', 'tfl', 'tfr', 'trl', 'trr'].forEach(function (id) {
    $(id).addEventListener('input', function () { $(id + 'V').textContent = this.value; feed(); });
  });
  ['sel', 'drive', 'turn', 'ev'].forEach(function (id) { $(id).addEventListener('change', feed); });
  $('theme').addEventListener('change', load);
  $('variant').addEventListener('change', load);
  $('notchOn').addEventListener('change', function () { $('notch').classList.toggle('hide', !this.checked); });

  /* the frame is 1280×480: on the phone it fits the width and the finger reaches the controls */
  var stage = $('stage'), fit = $('fit');
  function resize() {
    var k = Math.min(1, (document.documentElement.clientWidth - 16) / 1920);
    stage.style.transform = 'scale(' + k.toFixed(4) + ')';
    stage.style.margin = '8px 0 0 8px';
    fit.style.height = (720 * k + 16) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();
  load();
})();
</script>
</body>
</html>
