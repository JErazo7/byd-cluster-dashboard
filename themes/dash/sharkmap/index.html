<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script>
  window.EVS_W = 1280;
  if (/[#&]light=1/.test(location.hash)) document.documentElement.className += ' light';
  if (/[#&](panel|full)=1/.test(location.hash)) document.documentElement.className += ' panel';
</script>
<title>Shark Mapa</title>
<style>
  html, body { margin: 0; width: 100%; height: 480px; overflow: hidden; background: #0a1119; }
  html.panel, html.panel body { background: transparent; }
  #map { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* escurece as bordas para o texto respirar sobre o mapa */
  #shade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
    background: linear-gradient(90deg, rgba(4,10,18,.82) 0%, rgba(4,10,18,.45) 26%, rgba(4,10,18,0) 48%) }
  #hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
    font-family: "Barlow", Roboto, "Helvetica Neue", Arial, sans-serif; color: #e6eef6; }
  #hud svg { display: block; }
  #hud text { paint-order: stroke; stroke: rgba(4,10,18,.5); stroke-width: 4px; stroke-linejoin: round; }
  html.light #hud text { stroke: rgba(255,255,255,.65); }
  .dim { fill: #8fa3b8; } .accent { fill: #38cfff; } .warm { fill: #ffb020; } .good { fill: #35e07a; }
  html.light #hud { color: #0d151d; }
  html.light .dim { fill: #5b6a78; }
  html.light .accent { fill: #0079b8; }
</style>
</head>
<body>
<div id="map"></div>
<div id="shade"></div>
<div id="hud"><svg id="s" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="evmap.js"></script>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = window.EVS_W || 1280, H = 480;
  var svg = document.getElementById('s');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  var map = window.EvMap.create(document.getElementById('map'), { zoom: 16, northUp: false });
  /* posição de demonstração enquanto o carro não manda a dele */
  var DEMO = { lat: -23.5614, lon: -46.6559, brg: 20 };
  map.setPose(DEMO.lat, DEMO.lon, DEMO.brg);
  map.draw();

  function el(tag, attrs) {
    var n = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    svg.appendChild(n);
    return n;
  }
  function txt(x, y, s, size, cls, anchor) {
    var t = el('text', { x: x, y: y, 'font-size': size, class: cls || '', 'text-anchor': anchor || 'start' });
    t.textContent = s;
    return t;
  }

  var spd = el('text', { x: 40, y: 132, 'font-size': 96, 'font-weight': 500, fill: '#fff' });
  spd.textContent = '0';
  var unit = txt(44, 166, 'km/h', 20, 'dim');
  var sel = txt(44, 208, 'D', 26, 'accent');

  var man = txt(40, 400, '', 24, 'accent');
  var manDist = txt(40, 430, '', 18, 'dim');
  var eta = txt(40, 458, '', 18, 'dim');
  var clock = txt(W - 40, 44, '', 24, 'dim', 'end');
  var bat = txt(W - 40, 84, '', 22, 'dim', 'end');
  var src = txt(W - 40, 114, 'OSM · OSRM', 11, 'dim', 'end');

  var nav = null, ev = null;

  function drawClock() {
    var d = new Date();
    clock.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  setInterval(drawClock, 10000);
  drawClock();

  function drawEv(d) {
    ev = d;
    spd.textContent = Math.round(d.speed);
    sel.textContent = d.sel || 'P';
    if (d.soc >= 0) bat.textContent = Math.round(d.soc) + '%  ' + (d.range > -999 ? Math.round(d.range) + ' km' : '');

    if (d.pos && d.pos.lat) {
      map.setPose(d.pos.lat, d.pos.lon, d.pos.brg === undefined ? 0 : d.pos.brg);
      map.draw();
    }

    /* manobra: da rota própria; sem rota, a do Waze/Maps vem na notificação */
    if (nav && nav.on) {
      var mins = Math.max(1, Math.round(nav.dur / 60));
      var km = nav.dist > 1000 ? (nav.dist / 1000).toFixed(1) + ' km' : Math.round(nav.dist) + ' m';
      man.textContent = (nav.mod ? nav.mod + ' ' : '') + (nav.road || '');
      manDist.textContent = km + '  ·  ' + mins + ' min';
      var arrive = new Date(Date.now() + nav.dur * 1000);
      eta.textContent = 'llegada ' + ('0' + arrive.getHours()).slice(-2) + ':' + ('0' + arrive.getMinutes()).slice(-2);
    } else if (d.nav && d.nav.title) {
      man.textContent = d.nav.title.length > 42 ? d.nav.title.slice(0, 41) + '…' : d.nav.title;
      manDist.textContent = d.nav.text || '';
      eta.textContent = '';
    } else {
      man.textContent = '';
      manDist.textContent = '';
      eta.textContent = '';
    }
  }

  window.BrasaDriveUpdate = function (d) { if (d) drawEv(d); };

  /* rota própria: dest=lat,lon no endereço, ou pela API */
  window.EvsMap = {
    routeTo: function (lat, lon) {
      return map.routeTo(lon, lat).then(function (info) {
        nav = { on: true, dist: info.dist, dur: info.dur, man: info.man, mod: info.mod, road: info.road };
        if (ev) drawEv(ev);
        return info;
      });
    },
    clear: function () { nav = null; map.setRoute(null); map.draw(); if (ev) drawEv(ev); },
    map: map
  };

  var dest = /[#&]dest=(-?[\d.]+),(-?[\d.]+)/.exec(location.hash);
  if (dest) window.EvsMap.routeTo(+dest[1], +dest[2]);

  drawEv({ speed: 0, sel: 'P', soc: -1, range: -999 });
})();
</script>
</body>
</html>
