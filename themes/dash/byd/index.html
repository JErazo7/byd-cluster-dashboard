<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BYD</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04070c; }
  svg { display: block; }
  /* o carro do cartão de pressão vem sobre azul-escuro: o screen soma só o brilho */
  /* a arte vem com um fundo azul-escuro: o screen soma o brilho e o contrast joga o fundo a zero */
  #tyrecar { mix-blend-mode: screen; filter: contrast(1.55) brightness(1.22) saturate(1.1); }
  text { font-family: "Barlow", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #eaf3ff; }
  .dim { fill: #b9cfe2; }
  .mut { fill: #6a8aa6; }
  .cy { fill: #38cfff; }
  .or { fill: #ff9a3c; }
  .num { font-weight: 500; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 480"
     preserveAspectRatio="xMidYMid meet"></svg>
<script>
/*
 * BYD (SharkLab) — painel neon da caminhonete, na grelha das skins antigas (1280×480): o SVG
 * escala sozinho para o quadro do painel. Dois aros grandes nas pontas (pedal e potência, com
 * o arco de valor saindo do canto inferior esquerdo), velocidade no centro sobre a caminhonete
 * e três cartões embaixo: bateria/combustível/autonomia, pressão dos pneus e modo de condução.
 * Fotos em assets/: bg.jpg (paisagem), truck.png (caminhonete recortada com alfa) e tyre.jpg.
 */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = 1280, H = 480;
  var svg = document.getElementById('s');

  var LANG = (/[#&]lang=(pt|es|en)/.exec(location.hash) || [])[1] || 'es';
  var T = ({
    es: { thr: 'Acelerador', pow: 'Potencia', kmh: 'km/h', bat: 'Batería', fuel: 'Combustible', range: 'Autonomía Total', cons: 'Consumo', regen: 'Regeneración' },
    pt: { thr: 'Acelerador', pow: 'Potência', kmh: 'km/h', bat: 'Bateria', fuel: 'Combustível', range: 'Autonomia Total', cons: 'Consumo', regen: 'Regeneração' },
    en: { thr: 'Throttle', pow: 'Power', kmh: 'mph', bat: 'Battery', fuel: 'Fuel', range: 'Total Range', cons: 'Consumption', regen: 'Regen' }
  })[LANG] || {};

  /* unidades do painel BYD: 1 = métrico, 2 = imperial (o app manda km, km/h e kW) */
  function powTo(v) { return window.EvsPU === 2 ? v * 1.341 : v; }
  function powU() { return window.EvsPU === 2 ? 'hp' : 'kW'; }
  function spd(v) { return window.EvsSU === 2 ? v / 1.609344 : v; }
  function dist(v) { return window.EvsDU === 2 ? v / 1.609344 : v; }
  var DIST_U = (window.EvsDU === 2) ? 'mi' : 'km';

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  }
  function txt(x, y, s, size, cls, anchor, weight) {
    var t = el('text', {
      x: x, y: y, 'font-size': size || 16, 'text-anchor': anchor || 'middle',
      'font-weight': weight || 400, class: cls || ''
    });
    t.textContent = s == null ? '' : s;
    return t;
  }
  function pt(cx, cy, r, a) {
    var rad = a * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  /* arco de a0 a a1 (graus, 0 = leste, positivo no sentido horário); a1 < a0 vai anti-horário */
  function arcPath(cx, cy, r, a0, a1) {
    var d = a1 - a0;
    if (Math.abs(d) < 0.05) return '';
    var p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    var large = Math.abs(d) > 180 ? 1 : 0, sweep = d >= 0 ? 1 : 0;
    return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
      'A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
  }
  function rrect(x, y, w, h, r, attrs, parent) {
    return el('rect', Object.assign({ x: x, y: y, width: w, height: h, rx: r }, attrs), parent);
  }

  /* ---------- gradientes ---------- */
  var defs = el('defs');

  var gThr = el('linearGradient', { id: 'gThr', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  var thrStop = [
    el('stop', { offset: '0', 'stop-color': '#1b6fe0' }, gThr),
    el('stop', { offset: '0.55', 'stop-color': '#38cfff' }, gThr),
    el('stop', { offset: '1', 'stop-color': '#9ef0ff' }, gThr)
  ];

  var gPow = el('linearGradient', { id: 'gPow', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  el('stop', { offset: '0', 'stop-color': '#1b6fe0' }, gPow);
  el('stop', { offset: '0.45', 'stop-color': '#2f9df5' }, gPow);
  el('stop', { offset: '0.75', 'stop-color': '#ff8a2b' }, gPow);
  el('stop', { offset: '1', 'stop-color': '#ffd08a' }, gPow);

  var gRegen = el('linearGradient', { id: 'gRegen', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  el('stop', { offset: '0', 'stop-color': '#0e7c66' }, gRegen);
  el('stop', { offset: '0.5', 'stop-color': '#22d3a8' }, gRegen);
  el('stop', { offset: '1', 'stop-color': '#b8ffdf' }, gRegen);

  var gFade = el('linearGradient', { id: 'gFade', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#04070c', 'stop-opacity': '0' }, gFade);
  el('stop', { offset: '0.55', 'stop-color': '#04070c', 'stop-opacity': '0.75' }, gFade);
  el('stop', { offset: '1', 'stop-color': '#04070c', 'stop-opacity': '1' }, gFade);

  var gCard = el('linearGradient', { id: 'gCard', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#0c1c2e', 'stop-opacity': '0.9' }, gCard);
  el('stop', { offset: '1', 'stop-color': '#050c15', 'stop-opacity': '0.96' }, gCard);

  var tyreClip = el('clipPath', { id: 'cTyre' }, defs);
  el('rect', { x: 470, y: 330, width: 340, height: 120, rx: 18 }, tyreClip);

  var clip = el('clipPath', { id: 'clipFrame' }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H }, clip);

  /* ---------- fundo: paisagem ampliada (mais zoom que a foto original) ---------- */
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#04070c' });
  var gBg = el('g', { 'clip-path': 'url(#clipFrame)' });
  el('image', { href: 'assets/bg.jpg', x: -306, y: -8, width: 1892, height: 340, preserveAspectRatio: 'xMidYMid slice' }, gBg);
  el('rect', { x: 0, y: 150, width: W, height: 230, fill: 'url(#gFade)' }, gBg);
  el('rect', { x: 0, y: 380, width: W, height: 100, fill: '#04070c' }, gBg);

  /* arco fino de fundo atrás da velocidade */
  el('path', { d: arcPath(640, 336, 296, 208, 332), fill: 'none', stroke: '#38cfff', 'stroke-width': 2.5, opacity: 0.45 });
  el('path', { d: arcPath(640, 336, 310, 214, 326), fill: 'none', stroke: '#38cfff', 'stroke-width': 1.2, opacity: 0.2 });

  /* ---------- topo ---------- */
  var clockTxt = txt(24, 34, '', 22, 'num', 'start');
  el('rect', { x: 102, y: 16, width: 1, height: 22, fill: '#2a3d52' });
  var outTxt = txt(118, 34, '', 22, 'dim', 'start');

  for (var b = 0; b < 4; b++) {
    el('rect', { x: 1168 + b * 8, y: 30 - (5 + b * 5), width: 5, height: 5 + b * 5, rx: 1.5, fill: '#dbe9f7', opacity: 0.55 });
  }
  el('path', { d: 'M1232 20 L1246 32 L1238 38 L1238 14 L1246 20 L1232 32', fill: 'none', stroke: '#dbe9f7', 'stroke-width': 2, 'stroke-linejoin': 'round', opacity: 0.6 });
  el('path', { d: 'M1262 18 L1272 30 L1266 31 L1272 44 L1252 30 Z', fill: '#dbe9f7', opacity: 0.65 });

  /* ---------- aros ---------- */
  var RING_Y = 202, R = 104, LX = 172, RX = W - 172;
  var A_THR = 135, DIR_THR = 1;   /* esquerda: começa embaixo à esquerda e sobe pelo lado esquerdo */
  var A_POW = 45, DIR_POW = -1;   /* direita: começa embaixo à direita e sobe pelo lado direito */

  function ring(cx, grad, a0, dir) {
    var g = el('g');
    el('circle', { cx: cx, cy: RING_Y, r: R, fill: 'none', stroke: '#22405c', 'stroke-width': 2.4 }, g);
    el('circle', { cx: cx, cy: RING_Y, r: R - 9, fill: 'none', stroke: '#12253a', 'stroke-width': 1.2 }, g);
    var glow = el('path', { d: '', fill: 'none', stroke: grad, 'stroke-width': 26, 'stroke-linecap': 'round', opacity: 0.14 }, g);
    var val = el('path', { d: '', fill: 'none', stroke: grad, 'stroke-width': 17, 'stroke-linecap': 'round' }, g);
    return { glow: glow, val: val, cx: cx, a0: a0, dir: dir };
  }
  function setRing(rg, frac) {
    var f = Math.max(0, Math.min(0.9995, frac));   /* 360° exatos não desenham nada em SVG */
    var d = f > 0.004 ? arcPath(rg.cx, RING_Y, R, rg.a0, rg.a0 + rg.dir * 360 * f) : '';
    rg.val.setAttribute('d', d);
    rg.glow.setAttribute('d', d);
  }
  var thrRing = ring(LX, 'url(#gThr)', A_THR, DIR_THR);
  var powRing = ring(RX, 'url(#gPow)', A_POW, DIR_POW);

  /* rótulo em cima e valor+unidade centrados como um bloco só dentro do aro */
  var lblThr = txt(LX, 176, T.thr, 19, 'dim');
  lblThr.setAttribute('letter-spacing', '1.2');
  var thrNum = txt(LX, 244, '0', 56, 'num');
  var thrUnit = el('tspan', { 'font-size': 22, class: 'dim', dx: 4 });
  thrUnit.textContent = '%';
  thrNum.appendChild(thrUnit);

  var bolt = el('path', { d: 'M' + (RX - 4) + ' 150 l9 -16 l-2.5 10.5 h8 l-10 17 l2.5 -11.5 z', fill: '#ff9a3c', opacity: 0.9 });
  var lblPow = txt(RX, 176, T.pow, 19, 'dim');
  lblPow.setAttribute('letter-spacing', '1.2');
  var powNum = txt(RX, 244, '0', 56, 'num');
  var powUnit = el('tspan', { 'font-size': 22, class: 'dim', dx: 4 });
  powUnit.textContent = powU();
  powNum.appendChild(powUnit);
  var powLine = el('rect', { x: RX - 56, y: 258, width: 112, height: 2, rx: 1, fill: '#ff9a3c', opacity: 0.85 });
  var powLabel = txt(RX, 276, '', 13, 'mut');
  powLabel.setAttribute('letter-spacing', '1');

  /* ---------- centro: velocidade e caminhonete ---------- */
  var spdNum = txt(640, 124, '0', 106, 'num');
  spdNum.setAttribute('font-weight', 500);
  var kmhTxt = txt(640, 148, T.kmh, 20, 'mut');
  kmhTxt.setAttribute('paint-order', 'stroke');
  kmhTxt.setAttribute('stroke', 'rgba(3,8,16,0.75)');
  kmhTxt.setAttribute('stroke-width', '4');
  kmhTxt.setAttribute('stroke-linejoin', 'round');
  kmhTxt.setAttribute('fill', '#cfe4f6');

  var TRUCK_W = 300, TRUCK_H = Math.round(TRUCK_W * 203 / 400);
  el('ellipse', { cx: 640, cy: 308, rx: 176, ry: 15, fill: '#2f9df5', opacity: 0.16 });
  el('image', { href: 'assets/truck.png', x: 640 - TRUCK_W / 2, y: 308 - TRUCK_H, width: TRUCK_W, height: TRUCK_H });

  /* paginação decorativa das telas, como no desenho */
  el('circle', { cx: 626, cy: 318, r: 4, fill: '#eaf3ff' });
  el('circle', { cx: 640, cy: 318, r: 3.4, fill: '#41546a' });
  el('circle', { cx: 654, cy: 318, r: 3.4, fill: '#41546a' });

  /* ---------- cartões ---------- */
  function card(x, w) {
    var g = el('g');
    rrect(x, 330, w, 120, 18, { fill: 'url(#gCard)', stroke: '#1b6fe0', 'stroke-width': 1.3, 'stroke-opacity': 0.6 }, g);
    rrect(x, 330, w, 120, 18, { fill: 'none', stroke: '#38cfff', 'stroke-width': 5, opacity: 0.05 }, g);
    return g;
  }
  function batteryIcon(x, y, parent) {
    el('rect', { x: x, y: y, width: 18, height: 28, rx: 4, fill: 'none', stroke: '#38cfff', 'stroke-width': 2 }, parent);
    el('rect', { x: x + 5, y: y - 4, width: 8, height: 4, rx: 1, fill: '#38cfff' }, parent);
    return el('rect', { x: x + 3, y: y + 15, width: 12, height: 10, rx: 2, fill: '#38cfff' }, parent);
  }
  function pumpIcon(x, y, parent) {
    el('rect', { x: x, y: y, width: 15, height: 28, rx: 3, fill: 'none', stroke: '#38cfff', 'stroke-width': 2 }, parent);
    el('path', {
      d: 'M' + (x + 15) + ' ' + (y + 6) + 'h6v10a3.5 3.5 0 0 0 7 0V' + (y + 4),
      fill: 'none', stroke: '#38cfff', 'stroke-width': 2, 'stroke-linecap': 'round'
    }, parent);
    return el('rect', { x: x + 3, y: y + 6, width: 9, height: 7, rx: 1, fill: '#38cfff' }, parent);
  }
  function mountainIcon(x, y, s, parent) {
    return el('path', {
      d: 'M' + (x - s) + ' ' + (y + s * 0.6) + 'l' + (s * 0.55) + ' ' + (-s * 1.25) + 'l' + (s * 0.35) + ' ' + (s * 0.6) +
         'l' + (s * 0.28) + ' ' + (-s * 0.45) + 'l' + (s * 0.62) + ' ' + (s * 1.1) + 'z',
      fill: '#eaf3ff', opacity: 0.9
    }, parent);
  }

  /* cartão 1: bateria, combustível, autonomia */
  var c1 = card(14, 446);
  batteryIcon(44, 348, c1);
  var batNum = txt(74, 374, '--', 27, 'num', 'start');
  var batUnit = el('tspan', { 'font-size': 14, class: 'mut', dx: 3 });
  batUnit.textContent = '';
  batNum.appendChild(batUnit);
  txt(74, 392, T.bat, 11, 'mut', 'start');
  rrect(44, 404, 148, 6, 3, { fill: '#0e1d2c' }, c1);
  var batBar = rrect(44, 404, 0, 6, 3, { fill: '#38cfff' }, c1);

  pumpIcon(238, 348, c1);
  var fuelNum = txt(288, 374, '--', 27, 'num', 'start');
  var fuelUnit = el('tspan', { 'font-size': 14, class: 'mut', dx: 3 });
  fuelUnit.textContent = '';
  fuelNum.appendChild(fuelUnit);
  txt(288, 392, T.fuel, 11, 'mut', 'start');
  rrect(238, 404, 158, 6, 3, { fill: '#0e1d2c' }, c1);
  var fuelBar = rrect(238, 404, 0, 6, 3, { fill: '#38cfff' }, c1);

  el('rect', { x: 214, y: 344, width: 1, height: 60, fill: '#16283c' }, c1);
  mountainIcon(56, 430, 11, c1);
  txt(76, 436, T.range, 11, 'mut', 'start');
  var rangeNum = txt(436, 438, '', 21, 'num', 'end');

  /* cartão 2: pressões, com o carro visto de cima */
  var c2 = card(470, 340);
  c2.firstChild.setAttribute('fill', '#04090f');
  /* a imagem inteira preenche o cartão; os números ficam em cima, onde as linhas terminam */
  el('image', { id: 'tyrecar', href: 'assets/tyre.jpg', x: 533, y: 330, width: 213, height: 120,
    preserveAspectRatio: 'xMidYMid meet' }, c2);
  var TYRE = [['fl', 590, 358, 'end'], ['fr', 690, 358, 'start'], ['rl', 590, 424, 'end'], ['rr', 690, 424, 'start']];
  var tyreNum = {};
  TYRE.forEach(function (t) {
    var n = txt(t[1], t[2], '--', 17, 'num', t[3]);
    n.setAttribute('paint-order', 'stroke');
    n.setAttribute('stroke', 'rgba(2,6,14,0.8)');
    n.setAttribute('stroke-width', '3.5');
    n.setAttribute('stroke-linejoin', 'round');
    var u = el('tspan', { 'font-size': 10, class: 'mut', dx: 3 });
    u.textContent = '';
    n.appendChild(u);
    tyreNum[t[0]] = { num: n, unit: u };
  });

  /* cartão 3: modo de condução */
  var c3 = card(820, 446);
  rrect(852, 362, 382, 54, 27, { fill: 'none', stroke: '#2f9df5', 'stroke-width': 2.6 }, c3);
  rrect(852, 362, 382, 54, 27, { fill: 'none', stroke: '#38cfff', 'stroke-width': 9, opacity: 0.1 }, c3);
  mountainIcon(944, 386, 13, c3);
  var modeTxt = txt(1040, 396, '', 21, 'num', 'start', 500);
  modeTxt.setAttribute('letter-spacing', '1.5');

  /* ---------- barra inferior ---------- */
  el('path', { d: 'M0 452 H1280', stroke: '#12233a', 'stroke-width': 1 });
  function navIcon(kind, x) {
    var g = el('g', { transform: 'translate(' + x + ',466)', opacity: 0.8 });
    if (kind === 'home') el('path', { d: 'M-11 -1 L0 -10 L11 -1 L8 -1 L8 9 L-8 9 L-8 -1 Z', fill: 'none', stroke: '#dbe9f7', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
    if (kind === 'car') {
      el('path', { d: 'M-13 7 L-11 2 Q-10 -5 -2 -5 L2 -5 Q10 -5 11 2 L13 7 Z', fill: 'none', stroke: '#dbe9f7', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
      el('circle', { cx: -7.5, cy: 7.5, r: 2.2, fill: 'none', stroke: '#dbe9f7', 'stroke-width': 1.8 }, g);
      el('circle', { cx: 7.5, cy: 7.5, r: 2.2, fill: 'none', stroke: '#dbe9f7', 'stroke-width': 1.8 }, g);
    }
    if (kind === 'adas') el('path', { d: 'M-13 6 L-5 -8 L0 0 L4 -4 L13 6 Z', fill: 'none', stroke: '#dbe9f7', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
    if (kind === 'gear') {
      el('circle', { cx: 0, cy: 0, r: 9.5, fill: 'none', stroke: '#dbe9f7', 'stroke-width': 2 }, g);
      el('circle', { cx: 0, cy: 0, r: 3.5, fill: 'none', stroke: '#dbe9f7', 'stroke-width': 2 }, g);
      el('path', { d: 'M0 -9.5v3.4M0 6.1V9.5M-9.5 0h3.4M6.1 0H9.5', stroke: '#dbe9f7', 'stroke-width': 2 }, g);
    }
    return g;
  }
  navIcon('home', 62); navIcon('car', 200); navIcon('adas', 1080); navIcon('gear', 1218);
  var gearTxt = txt(640, 470, 'P', 25, 'num', null, 600);
  var warnTxt = txt(800, 474, '', 12, 'or', 'start');

  /* ---------- desenho ---------- */
  function fmt(v, dec) {
    if (v === null || v === undefined || v === -999 || isNaN(v)) return '--';
    return dec ? (+v).toFixed(dec) : String(Math.round(v));
  }
  function pct(v) { return (v === null || v === undefined || v === -999) ? null : Math.max(0, Math.min(100, v)); }

  var MODES = { 1: 'ECO', 2: 'NORMAL', 3: 'SPORT' };

  function rgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(a, b, t) {
    var x = typeof a === 'string' ? rgb(a) : a, y = typeof b === 'string' ? rgb(b) : b;
    return 'rgb(' + Math.round(x[0] + (y[0] - x[0]) * t) + ',' +
      Math.round(x[1] + (y[1] - x[1]) * t) + ',' +
      Math.round(x[2] + (y[2] - x[2]) * t) + ')';
  }
  /* pedal: azul até metade, âmbar a partir de 50% e vermelho no fim do curso */
  function pedalColour(f) {
    if (f <= 0.32) return mix('#1b6fe0', '#38cfff', f / 0.32);
    if (f <= 0.55) return mix('#38cfff', '#5ce0ff', (f - 0.32) / 0.23);
    if (f <= 0.75) return mix('#5ce0ff', '#ffbe3d', (f - 0.55) / 0.20);
    return mix('#ffbe3d', '#ff4b3e', (f - 0.75) / 0.25);
  }
  function tintThrottle(f) {
    var c = pedalColour(f);
    thrStop[0].setAttribute('stop-color', mix(c, '#04121f', 0.35));
    thrStop[1].setAttribute('stop-color', c);
    thrStop[2].setAttribute('stop-color', mix(c, '#ffffff', 0.45));
    thrRing.glow.setAttribute('opacity', (0.12 + 0.3 * f).toFixed(2));
  }

  function draw(d) {
    var kmh = Math.max(0, d.speed || 0);
    spdNum.textContent = String(Math.round(spd(kmh)));

    var tps = Math.max(0, Math.min(100, d.tps || 0));
    thrNum.firstChild.nodeValue = String(Math.round(tps));
    setRing(thrRing, tps / 100);
    tintThrottle(tps / 100);

    /* potência com sinal: negativo quando está regenerando */
    var kw = (d.pw === -999 || d.pw == null) ? 0 : d.pw;
    var p = Math.round(powTo(kw));
    powNum.firstChild.nodeValue = String(p);
    powUnit.textContent = powU();
    setRing(powRing, Math.min(1, Math.abs(kw) / 200));
    var regen = kw < -1;
    var powStroke = regen ? 'url(#gRegen)' : 'url(#gPow)';
    powRing.val.setAttribute('stroke', powStroke);
    powRing.glow.setAttribute('stroke', powStroke);
    powLabel.textContent = regen ? T.regen : (kw < 1 ? '' : T.cons);
    powLabel.setAttribute('class', regen ? 'cy' : 'mut');
    powLine.setAttribute('fill', regen ? '#38cfff' : '#ff9a3c');
    bolt.setAttribute('fill', regen ? '#38cfff' : '#ff9a3c');

    /* o feed manda o modo como texto em `drive` e o código em `dmode` (2 = NORMAL) */
    var mode = (typeof d.drive === 'string' && d.drive) ? d.drive : (MODES[+d.dmode] || '');
    modeTxt.textContent = mode.toUpperCase();

    var soc = pct(d.soc);
    batNum.firstChild.nodeValue = soc === null ? '--' : String(Math.round(soc));
    batUnit.textContent = soc === null ? '' : '%';
    batBar.setAttribute('width', soc === null ? 0 : (148 * soc / 100).toFixed(1));

    /* o combustível aparece em km (autonomia): `fuelKm`; se só vier a porcentagem do tanque,
       mostra em % e a barra usa essa porcentagem */
    var fuel = pct(d.fuel);
    var fuelKm = (d.fuelKm == null || d.fuelKm === -999) ? null : d.fuelKm;
    if (fuelKm !== null) {
      fuelNum.firstChild.nodeValue = String(Math.round(dist(fuelKm)));
      fuelUnit.textContent = DIST_U;
    } else {
      fuelNum.firstChild.nodeValue = fuel === null ? '--' : String(Math.round(fuel));
      fuelUnit.textContent = fuel === null ? '' : '%';
    }
    var fuelFrac = fuel !== null ? fuel / 100 : (fuelKm !== null ? Math.min(1, fuelKm / 900) : 0);
    fuelBar.setAttribute('width', (158 * fuelFrac).toFixed(1));

    var rg = (d.range === -999 || d.range == null) ? null : d.range;
    rangeNum.textContent = rg === null ? '--' : (Math.round(dist(rg)) + ' ' + DIST_U);

    /* pressão: o feed pode mandar bar (2.4) ou psi (34) — a unidade acompanha a grandeza */
    var y = d.tyre;
    if (y && y.fl != null) {
      var large = Math.max(+y.fl, +y.fr, +y.rl, +y.rr) > 10;
      TYRE.forEach(function (t) {
        var box = tyreNum[t[0]];
        box.num.firstChild.nodeValue = fmt(y[t[0]], large ? 0 : 1);
        box.unit.textContent = large ? 'PSI' : 'bar';
      });
    }

    gearTxt.textContent = d.sel || 'P';

    var now = new Date();
    clockTxt.textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
    outTxt.textContent = (d.tout === -999 || d.tout == null) ? '' : Math.round(d.tout) + ' °C';

    warnTxt.textContent = (d.warn && d.warn.length) ? d.warn.join('  ') : '';
  }

  window.BrasaDriveUpdate = function (d) { if (d) draw(d); };

  draw({ speed: 0, tps: 0, pw: 0, soc: -999, fuel: -999, range: -999, sel: 'P', tout: -999 });
})();
</script>
</body>
</html>
