<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BYD</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04070c; }
  svg { display: block; }
  /* car art identical in every mode: no scene filter */
  #tyrecar { filter: none; }
  /* pressure HUD overlay colours: they follow the scene, like the rest of the panel */
  svg { --tire-color: #16c8ff; --tire-bright: #a8f4ff; --tire-dim: #087bce; }
  .tyre-link { fill: none; stroke: var(--tire-dim); stroke-width: 1.2; opacity: .75;
               stroke-linecap: round; }
  text { font-family: "Barlow", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #eaf3ff; }
  /* the accent colours come from variables: switching mode changes everything at once */
  svg { --accent: #0480ff; --accent-core: #8ac6ff; --accent-soft: #2f4f6c; --accent-icon: #5ab6ff; }
  .edge-halo { stroke: var(--accent); }
  .edge-mid { stroke: var(--accent); }
  .edge-core { stroke: var(--accent-core); }
  .ring { stroke: var(--accent); }
  .ring.on { stroke: var(--accent-core); }
  .tick { stroke: var(--accent-soft); }
  .icon { stroke: var(--accent-icon); }
  .bar-lit, .icon-fill { fill: var(--accent); }
  /* the landscape swap is animated in JS: cross-fade with a zoom-in */
  .dim { fill: #b9cfe2; }
  .mut { fill: #6a8aa6; }
  .cy { fill: #38cfff; }
  .or { fill: #ff9a3c; }
  .num { font-weight: 500; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 480"
     preserveAspectRatio="xMidYMid meet"></svg>
<!-- package pressure HUD overlay, inline: inherits the theme CSS variables -->
<script type="text/plain" id="tireHudSrc">
<defs>
    <linearGradient id="tireConnector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--tire-dim)" stop-opacity=".18"/>
      <stop offset=".52" style="stop-color:var(--tire-color)"/>
      <stop offset="1" style="stop-color:var(--tire-bright)"/>
    </linearGradient>
    <radialGradient id="tireHub" cx="50%" cy="50%" r="55%">
      <stop offset="0" style="stop-color:var(--tire-color)" stop-opacity=".22"/>
      <stop offset=".68" style="stop-color:var(--tire-color)" stop-opacity=".07"/>
      <stop offset="1" style="stop-color:var(--tire-color)" stop-opacity="0"/>
    </radialGradient>
    <filter id="tireSoftGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tireTightGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="tireWheelModule">
      <!-- Soft halo -->
      <circle r="44" fill="url(#tireHub)"/>
      <!-- Outer segmented ring -->
      <circle r="35" fill="none" style="stroke:var(--tire-dim)" stroke-width="2" opacity=".65"
              stroke-dasharray="42 8 18 8 42 8 18 8"/>
      <circle r="29" fill="none" stroke="url(#tireConnector)" stroke-width="2.8"
              stroke-dasharray="48 8 20 8 48 8 20 8" filter="url(#tireSoftGlow)"/>
      <circle r="22" fill="none" style="stroke:var(--tire-bright)" stroke-width="1.5"
              opacity=".8" stroke-dasharray="3 5"/>
      <!-- Four small locator ticks -->
      <g style="stroke:var(--tire-bright)" stroke-width="2.5" stroke-linecap="round" filter="url(#tireTightGlow)">
        <path d="M0 -42 V-35 M42 0 H35 M0 42 V35 M-42 0 H-35"/>
      </g>
      <!-- Small bright nodes -->
      <g style="fill:var(--tire-bright)" filter="url(#tireTightGlow)">
        <circle cx="0" cy="-35" r="2.8"/>
        <circle cx="35" cy="0" r="2.8"/>
        <circle cx="0" cy="35" r="2.8"/>
        <circle cx="-35" cy="0" r="2.8"/>
      </g>
      <circle r="5" style="fill:var(--tire-color)" opacity=".85" filter="url(#tireTightGlow)"/>
    </g>
  </defs>

  <!-- FRONT LEFT: module centered near the front axle -->
  <g id="front-left" transform="translate(75 485)">
    <use href="#tireWheelModule" xlink:href="#tireWheelModule"/>
    <path d="M-39 0 H-58 L-77 -18 H-113" fill="none" stroke="url(#tireConnector)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#tireTightGlow)"/>
    <path d="M-77 -18 H-104" fill="none" style="stroke:var(--tire-bright)" stroke-width="1.2" opacity=".85"/>
  </g>
  <!-- FRONT RIGHT -->
  <g id="front-right" transform="translate(576 485)">
    <use href="#tireWheelModule" xlink:href="#tireWheelModule"/>
    <path d="M39 0 H58 L77 -18 H113" fill="none" stroke="url(#tireConnector)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#tireTightGlow)"/>
    <path d="M77 -18 H104" fill="none" style="stroke:var(--tire-bright)" stroke-width="1.2" opacity=".85"/>
  </g>
  <!-- REAR LEFT -->
  <g id="rear-left" transform="translate(75 1040)">
    <use href="#tireWheelModule" xlink:href="#tireWheelModule"/>
    <path d="M-39 0 H-58 L-77 18 H-113" fill="none" stroke="url(#tireConnector)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#tireTightGlow)"/>
    <path d="M-77 18 H-104" fill="none" style="stroke:var(--tire-bright)" stroke-width="1.2" opacity=".85"/>
  </g>
  <!-- REAR RIGHT -->
  <g id="rear-right" transform="translate(576 1040)">
    <use href="#tireWheelModule" xlink:href="#tireWheelModule"/>
    <path d="M39 0 H58 L77 18 H113" fill="none" stroke="url(#tireConnector)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#tireTightGlow)"/>
    <path d="M77 18 H104" fill="none" style="stroke:var(--tire-bright)" stroke-width="1.2" opacity=".85"/>
  </g>
</script>
<script>
/*
 * BYD (SharkLab) — neon pickup dashboard on the grid of the old skins (1280×480): the SVG
 * scales itself to the panel frame. Two big rings at the ends (throttle and power, with
 * the value arc growing from the bottom left corner), speed in the centre over the pickup
 * and three cards at the bottom: battery/fuel/range, tyre pressure and driving mode.
 * Photos in assets/: bg.jpg (landscape), truck.png (cut-out pickup with alpha) and
 * tyre-car.png (top view with alpha, drawn with vector connectors).
 */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = 1280, H = 480;
  var svg = document.getElementById('s');

  var LANG = (/[#&]lang=(pt|es|en)/.exec(location.hash) || [])[1] || 'es';
  var T = ({
    es: { thr: 'Acelerador', pow: 'Potencia', kmh: 'km/h', bat: 'Batería', fuel: 'Combustible', range: 'Autonomía EV', cons: 'Consumo', regen: 'Regeneración' },
    pt: { thr: 'Acelerador', pow: 'Potência', kmh: 'km/h', bat: 'Bateria', fuel: 'Combustível', range: 'Autonomia EV', cons: 'Consumo', regen: 'Regeneração' },
    en: { thr: 'Throttle', pow: 'Power', kmh: 'mph', bat: 'Battery', fuel: 'Fuel', range: 'EV Range', cons: 'Consumption', regen: 'Regen' }
  })[LANG] || {};

  /* BYD panel units: 1 = metric, 2 = imperial (the app sends km, km/h and kW) */
  function powTo(v) { return window.EvsPU === 2 ? v * 1.341 : v; }
  function powU() { return window.EvsPU === 2 ? 'hp' : 'kW'; }
  function spd(v) { return window.EvsSU === 2 ? v / 1.609344 : v; }
  function dist(v) { return window.EvsDU === 2 ? v / 1.609344 : v; }
  var DIST_U = (window.EvsDU === 2) ? 'mi' : 'km';

  var layer = svg;          /* everything that is interface goes here and can be masked */
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    (parent || layer).appendChild(n);
    return n;
  }
  function txt(x, y, s, size, cls, anchor, weight, parent) {
    var t = el('text', {
      x: x, y: y, 'font-size': size || 16, 'text-anchor': anchor || 'middle',
      'font-weight': weight || 400, class: cls || ''
    }, parent);
    t.textContent = s == null ? '' : s;
    return t;
  }
  function pt(cx, cy, r, a) {
    var rad = a * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  /* arc from a0 to a1 (degrees, 0 = east, positive clockwise); a1 < a0 goes anticlockwise */
  function arcPath(cx, cy, r, a0, a1) {
    var d = a1 - a0;
    if (Math.abs(d) < 0.05) return '';
    var p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    var large = Math.abs(d) > 180 ? 1 : 0, sweep = d >= 0 ? 1 : 0;
    return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
      'A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
  }
  function rrect(x, y, w, h, r, attrs, parent) {
    return el('rect', Object.assign({ x: x, y: y, width: w, height: h, rx: r }, attrs), parent);
  }

  /* ---------- gradients ---------- */
  var defs = el('defs');

  var gThr = el('linearGradient', { id: 'gThr', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  /* same palette as the power ring; the orange comes in earlier as the pedal goes down */
  var thrStop = [
    el('stop', { offset: '0', 'stop-color': '#1b6fe0' }, gThr),
    el('stop', { offset: '0.5', 'stop-color': '#2f9df5' }, gThr),
    el('stop', { offset: '1', 'stop-color': '#ff8a2b' }, gThr)
  ];

  var gPow = el('linearGradient', { id: 'gPow', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  var powStop = [
    el('stop', { offset: '0', 'stop-color': '#1b6fe0' }, gPow),
    el('stop', { offset: '0.45', 'stop-color': '#2f9df5' }, gPow),
    el('stop', { offset: '0.75', 'stop-color': '#ff8a2b' }, gPow),
    el('stop', { offset: '1', 'stop-color': '#ffd08a' }, gPow)
  ];

  var gRegen = el('linearGradient', { id: 'gRegen', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  el('stop', { offset: '0', 'stop-color': '#0e7c66' }, gRegen);
  el('stop', { offset: '0.5', 'stop-color': '#22d3a8' }, gRegen);
  el('stop', { offset: '1', 'stop-color': '#b8ffdf' }, gRegen);

  var gFade = el('linearGradient', { id: 'gFade', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#04070c', 'stop-opacity': '0' }, gFade);
  el('stop', { offset: '0.55', 'stop-color': '#04070c', 'stop-opacity': '0.75' }, gFade);
  el('stop', { offset: '1', 'stop-color': '#04070c', 'stop-opacity': '1' }, gFade);

  var gCard = el('linearGradient', { id: 'gCard', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#0c1c2e', 'stop-opacity': '0.9' }, gCard);
  el('stop', { offset: '1', 'stop-color': '#050c15', 'stop-opacity': '0.96' }, gCard);


  var safeMask = el('mask', { id: 'mSafe', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#fff' }, safeMask);
  el('rect', { x: 427, y: -1, width: 426, height: 58, rx: 12, fill: '#000' }, safeMask);

  var clip = el('clipPath', { id: 'clipFrame' }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H }, clip);

  /* ---------- background: enlarged landscape (more zoom than the original photo) ---------- */
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#04070c' });
  var gBg = el('g', { id: 'gBg', 'clip-path': 'url(#clipFrame)' });
  var bgNormal = el('image', {
    id: 'bgNight', href: 'assets/bg.jpg', opacity: 1,
    x: -306, y: -8, width: 1892, height: 340, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  var bgSport = el('image', {
    id: 'bgSport', href: 'assets/bg-sport.jpg', opacity: 0,
    x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  var bgMountain = el('image', {
    id: 'bgMountain', href: 'assets/bg-mountain.jpg', opacity: 0,
    x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  /* the mud scene comes in at full width; a little more zoom so the mud dominates */
  var bgMud = el('image', {
    id: 'bgMud', href: 'assets/bg-mud.jpg', opacity: 0,
    x: -110, y: -60, width: 1500, height: 563, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  var bgSnow = el('image', {
    id: 'bgSnow', href: 'assets/bg-snow.jpg', opacity: 0,
    x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  var bgSand = el('image', {
    id: 'bgSand', href: 'assets/bg-sand.jpg', opacity: 0,
    x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  /* dark veil per scene: the bright photos need it so the white text can breathe */
  var sceneDim = el('rect', { x: 0, y: 0, width: W, height: H, fill: '#04070c', opacity: 0 }, gBg);
  el('rect', { x: 0, y: 150, width: W, height: 230, fill: 'url(#gFade)' }, gBg);
  el('rect', { x: 0, y: 380, width: W, height: 100, fill: '#04070c' }, gBg);

  /* thin background arc behind the speed */
  layer = el('g', { mask: 'url(#mSafe)' });
  el('path', { d: arcPath(640, 336, 258, 208, 332), fill: 'none', stroke: '#38cfff', 'stroke-width': 2.5, opacity: 0.45 });
  el('path', { d: arcPath(640, 336, 270, 214, 326), fill: 'none', stroke: '#38cfff', 'stroke-width': 1.2, opacity: 0.2 });

  /* ---------- top ---------- */
  /* clock on the left and odometer on the right; the temperature does not come back */
  var clockTxt = txt(24, 32, '--:--', 18, 'num', 'start');
  var warnTxt = txt(112, 32, '', 14, 'or', 'start');
  var odoTxt = txt(1264, 34, '--', 19, 'num', 'end');
  var odoUnit = el('tspan', { 'font-size': 12, class: 'mut', dx: 3 });
  odoUnit.textContent = DIST_U;
  odoTxt.appendChild(odoUnit);

  /* ---------- rings ---------- */
  var RING_Y = 198, R = 172, LX = 190, RX = W - 190;
  /* arc open at the bottom: the ends sit high enough not to touch the cards */
  var SWEEP = 244;
  var A_THR = 148, DIR_THR = 1;   /* left: starts at the bottom left and rises up the left side */
  var A_POW = 32, DIR_POW = -1;   /* right: starts at the bottom right and rises up the right side */

  function ring(cx, grad, a0, dir) {
    var g = el('g');
    var full = arcPath(cx, RING_Y, R, a0, a0 + dir * SWEEP);
    /* ring track, dotted tick ring and the value arc */
    var track = el('path', { d: full, fill: 'none', stroke: '#22405c', 'stroke-width': 17, 'stroke-linecap': 'round' }, g);
    /* red zone at the end of the travel */
    var red = el('path', {
      d: arcPath(cx, RING_Y, R, a0 + dir * SWEEP * 0.9, a0 + dir * SWEEP), fill: 'none',
      stroke: '#ff2f2f', 'stroke-width': 17, 'stroke-linecap': 'round', opacity: 0
    }, g);
    /* short radial marks along the arc */
    var TICKS = 25;
    for (var t = 0; t < TICKS; t++) {
      var ta = a0 + dir * SWEEP * (t / (TICKS - 1));
      var major = t % 6 === 0;
      var p0 = pt(cx, RING_Y, R - 13, ta), p1 = pt(cx, RING_Y, R - (major ? 32 : 24), ta);
      el('line', {
        x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1],
        class: 'tick', 'stroke-width': major ? 2.4 : 1.5,
        'stroke-linecap': 'butt', opacity: major ? 0.95 : 0.7
      }, g);
    }
    var glow = el('path', { d: '', fill: 'none', stroke: grad, 'stroke-width': 36, 'stroke-linecap': 'round', opacity: 0.16 }, g);
    var val = el('path', { d: '', fill: 'none', stroke: grad, 'stroke-width': 17, 'stroke-linecap': 'round' }, g);
    return { glow: glow, val: val, red: red, track: track, cx: cx, a0: a0, dir: dir, f: -1, d: '' };
  }
  function setRing(rg, frac) {
    var f = Math.max(0, Math.min(0.9995, frac));   /* an exact 360° draws nothing in SVG */
    if (Math.abs(f - rg.f) < 0.0004) return;       /* stopped: do not rewrite the geometry */
    rg.f = f;
    var d = f > 0.004 ? arcPath(rg.cx, RING_Y, R, rg.a0, rg.a0 + rg.dir * SWEEP * f) : '';
    if (rg.d === d) return;
    rg.d = d;
    rg.val.setAttribute('d', d);
    rg.glow.setAttribute('d', d);
  }
  var thrRing = ring(LX, 'url(#gThr)', A_THR, DIR_THR);
  var powRing = ring(RX, 'url(#gPow)', A_POW, DIR_POW);

  /* label on top and value+unit centred as a single block inside the ring */
  var lblThr = txt(LX, 166, T.thr, 23, 'dim');
  lblThr.setAttribute('letter-spacing', '1.2');
  var thrNum = txt(LX, 248, '0', 70, 'num');
  var thrUnit = el('tspan', { 'font-size': 22, class: 'dim', dx: 4 });
  thrUnit.textContent = '%';
  thrNum.appendChild(thrUnit);

  var bolt = el('path', { d: 'M' + (RX - 4) + ' 132 l10 -18 l-2.8 11.6 h8.8 l-11 18.8 l2.8 -12.4 z', fill: '#ff9a3c', opacity: 0.9 });
  var lblPow = txt(RX, 166, T.pow, 23, 'dim');
  lblPow.setAttribute('letter-spacing', '1.2');
  var powNum = txt(RX, 248, '0', 70, 'num');
  var powUnit = el('tspan', { 'font-size': 22, class: 'dim', dx: 4 });
  powUnit.textContent = powU();
  powNum.appendChild(powUnit);
  var powLine = el('rect', { x: RX - 58, y: 274, width: 116, height: 2, rx: 1, fill: '#ff9a3c', opacity: 0.85 });
  var powLabel = txt(RX, 292, '', 13, 'mut');
  powLabel.setAttribute('letter-spacing', '1');

  /* ---------- centre: speed and pickup ---------- */
  var spdNum = txt(640, 134, '0', 106, 'num');
  spdNum.setAttribute('font-weight', 500);
  var kmhTxt = txt(640, 160, T.kmh, 21, 'mut');
  kmhTxt.setAttribute('paint-order', 'stroke');
  kmhTxt.setAttribute('stroke', 'rgba(3,8,16,0.75)');
  kmhTxt.setAttribute('stroke-width', '4');
  kmhTxt.setAttribute('stroke-linejoin', 'round');
  kmhTxt.setAttribute('fill', '#cfe4f6');

  var TRUCK_W = 312, TRUCK_H = Math.round(TRUCK_W * 203 / 400);
  var truckGlow = el('ellipse', { cx: 640, cy: 318, rx: 152, ry: 8, fill: '#2f9df5', opacity: 0.16 });
  /* truck.png is an optional, user-supplied asset: draw the pickup only when the file exists */
  (function () {
    var truckLayer = layer, probe = new Image();
    probe.onload = function () {
      el('image', {
        href: 'assets/truck.png',
        x: 640 - TRUCK_W / 2, y: 318 - TRUCK_H, width: TRUCK_W, height: TRUCK_H
      }, truckLayer);
    };
    probe.src = 'assets/truck.png';
  })();

  /* decorative screen pagination, as in the design */

  /* ---------- cards ---------- */
  /* neon ring: wide halo + medium stroke + bright core, like the lines of the pressure image */
  var NEON = '#0480ff';                 /* measured on the lines of the pressure image */
  var NEON_CORE = '#8ac6ff';
  var ICON = '#5ab6ff';
  function neon(parent, x, y, w, h, r, k) {
    var f = k || 1;
    rrect(x, y, w, h, r, { class: 'edge-halo', fill: 'none', 'stroke-width': 9 * f, opacity: 0.08 }, parent);
    rrect(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 3), { class: 'edge-core', fill: 'none', 'stroke-width': 1, opacity: 0.18 }, parent);
    return rrect(x, y, w, h, r, { class: 'edge-mid', fill: 'none', 'stroke-width': 1.5 * f, opacity: 0.65 }, parent);
  }
  /* liquid glass: diagonal sheen running across the card */
  var gGlass = el('linearGradient', { id: 'gGlass', x1: '0', y1: '0', x2: '1', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#ffffff', 'stop-opacity': '0.17' }, gGlass);
  el('stop', { offset: '0.42', 'stop-color': '#ffffff', 'stop-opacity': '0.05' }, gGlass);
  el('stop', { offset: '0.62', 'stop-color': '#ffffff', 'stop-opacity': '0.02' }, gGlass);
  el('stop', { offset: '1', 'stop-color': '#ffffff', 'stop-opacity': '0.12' }, gGlass);

  var gGlassShade = el('linearGradient', { id: 'gGlassShade', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#000000', 'stop-opacity': '0' }, gGlassShade);
  el('stop', { offset: '1', 'stop-color': '#000000', 'stop-opacity': '0.12' }, gGlassShade);

  var cardSeq = 0;
  /* blur only over the card area: cheap on the car SoC */
  function glassBlur(x, w) {
    var id = 'fGlass' + (++cardSeq);
    var f = el('filter', {
      id: id, filterUnits: 'userSpaceOnUse',
      x: x - 4, y: 326, width: w + 8, height: 144
    }, defs);
    el('feGaussianBlur', { stdDeviation: '14' }, f);
    return id;
  }

  function card(x, w) {
    var g = el('g');
    var blur = glassBlur(x, w);
    var cid = 'cGlass' + cardSeq;
    var cp = el('clipPath', { id: cid }, defs);
    rrect(x, 330, w, 136, 18, {}, cp);
    var inner = el('g', { 'clip-path': 'url(#' + cid + ')' }, g);
    /* whatever is behind shows up blurred: real frosted glass */
    el('use', { href: '#gBg', filter: 'url(#' + blur + ')' }, inner);

      : (GSEL[+d.gsel] || 'P');
    if (lastSel !== sel) {
      lastSel = sel;
      gearCells.forEach(function (c, i) {
        var on = SEL_ORDER[i] === sel;
        attr(c.bg, 'fill', on ? 'rgba(4,128,255,0.3)' : 'rgba(11,24,38,0.9)');
        attr(c.ring, 'class', on ? 'ring on' : 'ring');
        attr(c.ring, 'opacity', on ? '1' : '0.55');
        attr(c.ring, 'stroke-width', on ? '2' : '1.3');
        attr(c.tx, 'class', on ? 'num' : 'mut');
        attr(c.tx, 'fill', on ? '#eaf7ff' : '#5d7891');
      });
    }

    var odo = (d.odo === -999 || d.odo == null) ? null : d.odo;
    num(odoTxt, odo === null ? '--' : String(Math.round(dist(odo))));
    setText(odoUnit, odo === null ? '' : DIST_U);

    var now = new Date();
    setText(clockTxt, ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2));

    setText(warnTxt, (d.warn && d.warn.length) ? d.warn.join('  ') : '');

    startAnim();
  }

  /* ---------- animation ----------
     The panel is a virtual window: Chromium freezes the page requestAnimationFrame (that is what
     ClusterOverlay.java documents), so the rings are moved by this timer — the same
     trick the landscape cross-fade already uses. The app pushes the state at 2.5 Hz: without
     interpolation the ring moves in 400 ms steps, which reads as "stuck"; with it the
     movement is continuous and the number does not blink. */
  var TGT = { speed: 0, tps: 0, pw: 0, powValid: true };
  var CUR = { speed: 0, tps: 0, pw: 0 };
  var TAU = 90;                 /* ms: reaches the target in ~300 ms, inside the 400 ms step */
  var anim = { timer: 0, last: 0 };
  var lastMode = null, lastScene = null, lastRingStyle = null, lastSel = null, curScene = 'night';
  var lastPowValid = true, animDirty = false;

  function startAnim() {
    /* only starts the step when a difference is pending: idle, the panel spends no frames */
    if (anim.timer) return;
    if (!animDirty
        && Math.abs(TGT.speed - CUR.speed) < 0.05 && Math.abs(TGT.tps - CUR.tps) < 0.05
        && Math.abs(TGT.pw - CUR.pw) < 0.05) return;
    anim.last = 0;
    anim.timer = setTimeout(animStep, 16);
  }

  function animStep() {
    anim.timer = 0;
    animDirty = false;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    var dt = anim.last ? now - anim.last : 16;
    anim.last = now;
    if (dt > 250) dt = 250;                      /* frozen tab: resumes without a jump */
    var k = 1 - Math.exp(-dt / TAU), moving = false;
    ['speed', 'tps', 'pw'].forEach(function (name) {
      var delta = TGT[name] - CUR[name];
      if (Math.abs(delta) < 0.05) { CUR[name] = TGT[name]; return; }
      CUR[name] += delta * k;
      moving = true;
    });
    setText(spdNum, String(Math.round(spd(CUR.speed))));
    num(thrNum, String(Math.round(CUR.tps)));
    setRing(thrRing, CUR.tps / 100);
    tintThrottle(CUR.tps / 100, curScene);
    num(powNum, TGT.powValid ? String(Math.round(powTo(CUR.pw))) : '--');
    setRing(powRing, Math.min(1, Math.abs(CUR.pw) / 200));
    /* the ring colour and the label follow the target sign (regenerating or not) */
    if (moving) anim.timer = setTimeout(animStep, 16);
    else startAnim();
  }

  window.BrasaDriveUpdate = function (d) { if (d) draw(d); };

  draw({ speed: 0, tps: 0, pw: 0, soc: -999, fuel: -999, range: -999, sel: 'P', tout: -999 });
})();
</script>
</body>
