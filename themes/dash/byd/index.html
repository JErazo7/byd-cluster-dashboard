<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BYD</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04070c; }
  svg { display: block; }
  /* o carro do cartão de pressão vem sobre azul-escuro: o screen soma só o brilho */
  /* a arte vem com um fundo azul-escuro: o screen soma o brilho e o contrast joga o fundo a zero */
  #tyrecar { mix-blend-mode: screen; filter: contrast(1.55) brightness(1.22) saturate(1.1); }
  text { font-family: "Barlow", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #eaf3ff; }
  .dim { fill: #b9cfe2; }
  .mut { fill: #6a8aa6; }
  .cy { fill: #38cfff; }
  .or { fill: #ff9a3c; }
  .num { font-weight: 500; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 480"
     preserveAspectRatio="xMidYMid meet"></svg>
<script>
/*
 * BYD (SharkLab) — painel neon da caminhonete, na grelha das skins antigas (1280×480): o SVG
 * escala sozinho para o quadro do painel. Dois aros grandes nas pontas (pedal e potência, com
 * o arco de valor saindo do canto inferior esquerdo), velocidade no centro sobre a caminhonete
 * e três cartões embaixo: bateria/combustível/autonomia, pressão dos pneus e modo de condução.
 * Fotos em assets/: bg.jpg (paisagem), truck.png (caminhonete recortada com alfa) e tyre.jpg.
 */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = 1280, H = 480;
  var svg = document.getElementById('s');

  var LANG = (/[#&]lang=(pt|es|en)/.exec(location.hash) || [])[1] || 'es';
  var T = ({
    es: { thr: 'Acelerador', pow: 'Potencia', kmh: 'km/h', bat: 'Batería', fuel: 'Combustible', range: 'Autonomía Total', cons: 'Consumo', regen: 'Regeneración' },
    pt: { thr: 'Acelerador', pow: 'Potência', kmh: 'km/h', bat: 'Bateria', fuel: 'Combustível', range: 'Autonomia Total', cons: 'Consumo', regen: 'Regeneração' },
    en: { thr: 'Throttle', pow: 'Power', kmh: 'mph', bat: 'Battery', fuel: 'Fuel', range: 'Total Range', cons: 'Consumption', regen: 'Regen' }
  })[LANG] || {};

  /* unidades do painel BYD: 1 = métrico, 2 = imperial (o app manda km, km/h e kW) */
  function powTo(v) { return window.EvsPU === 2 ? v * 1.341 : v; }
  function powU() { return window.EvsPU === 2 ? 'hp' : 'kW'; }
  function spd(v) { return window.EvsSU === 2 ? v / 1.609344 : v; }
  function dist(v) { return window.EvsDU === 2 ? v / 1.609344 : v; }
  var DIST_U = (window.EvsDU === 2) ? 'mi' : 'km';

  var layer = svg;          /* tudo o que é interface vai aqui e pode ser mascarado */
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    (parent || layer).appendChild(n);
    return n;
  }
  function txt(x, y, s, size, cls, anchor, weight, parent) {
    var t = el('text', {
      x: x, y: y, 'font-size': size || 16, 'text-anchor': anchor || 'middle',
      'font-weight': weight || 400, class: cls || ''
    }, parent);
    t.textContent = s == null ? '' : s;
    return t;
  }
  function pt(cx, cy, r, a) {
    var rad = a * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  /* arco de a0 a a1 (graus, 0 = leste, positivo no sentido horário); a1 < a0 vai anti-horário */
  function arcPath(cx, cy, r, a0, a1) {
    var d = a1 - a0;
    if (Math.abs(d) < 0.05) return '';
    var p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    var large = Math.abs(d) > 180 ? 1 : 0, sweep = d >= 0 ? 1 : 0;
    return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
      'A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
  }
  function rrect(x, y, w, h, r, attrs, parent) {
    return el('rect', Object.assign({ x: x, y: y, width: w, height: h, rx: r }, attrs), parent);
  }

  /* ---------- gradientes ---------- */
  var defs = el('defs');

  var gThr = el('linearGradient', { id: 'gThr', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  /* mesma paleta do aro da potência; o laranja entra mais cedo conforme o pedal afunda */
  var thrStop = [
    el('stop', { offset: '0', 'stop-color': '#1b6fe0' }, gThr),
    el('stop', { offset: '0.5', 'stop-color': '#2f9df5' }, gThr),
    el('stop', { offset: '1', 'stop-color': '#ff8a2b' }, gThr)
  ];

  var gPow = el('linearGradient', { id: 'gPow', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  el('stop', { offset: '0', 'stop-color': '#1b6fe0' }, gPow);
  el('stop', { offset: '0.45', 'stop-color': '#2f9df5' }, gPow);
  el('stop', { offset: '0.75', 'stop-color': '#ff8a2b' }, gPow);
  el('stop', { offset: '1', 'stop-color': '#ffd08a' }, gPow);

  var gRegen = el('linearGradient', { id: 'gRegen', x1: '0.2', y1: '1', x2: '0.8', y2: '0' }, defs);
  el('stop', { offset: '0', 'stop-color': '#0e7c66' }, gRegen);
  el('stop', { offset: '0.5', 'stop-color': '#22d3a8' }, gRegen);
  el('stop', { offset: '1', 'stop-color': '#b8ffdf' }, gRegen);

  var gFade = el('linearGradient', { id: 'gFade', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#04070c', 'stop-opacity': '0' }, gFade);
  el('stop', { offset: '0.55', 'stop-color': '#04070c', 'stop-opacity': '0.75' }, gFade);
  el('stop', { offset: '1', 'stop-color': '#04070c', 'stop-opacity': '1' }, gFade);

  var gCard = el('linearGradient', { id: 'gCard', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#0c1c2e', 'stop-opacity': '0.9' }, gCard);
  el('stop', { offset: '1', 'stop-color': '#050c15', 'stop-opacity': '0.96' }, gCard);

  var tyreClip = el('clipPath', { id: 'cTyre' }, defs);
  el('rect', { x: 470, y: 330, width: 340, height: 136, rx: 18 }, tyreClip);

  var safeMask = el('mask', { id: 'mSafe', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#fff' }, safeMask);
  el('rect', { x: 427, y: -1, width: 426, height: 58, rx: 12, fill: '#000' }, safeMask);

  var clip = el('clipPath', { id: 'clipFrame' }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H }, clip);

  /* ---------- fundo: paisagem ampliada (mais zoom que a foto original) ---------- */
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#04070c' });
  var gBg = el('g', { 'clip-path': 'url(#clipFrame)' });
  var bgNormal = el('image', {
    href: 'assets/bg.jpg', x: -306, y: -8, width: 1892, height: 340, preserveAspectRatio: 'xMidYMid slice'
  }, gBg);
  var bgSport = el('image', {
    href: 'assets/bg-sport.jpg', x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'xMidYMid slice', opacity: 0
  }, gBg);
  el('rect', { x: 0, y: 150, width: W, height: 230, fill: 'url(#gFade)' }, gBg);
  el('rect', { x: 0, y: 380, width: W, height: 100, fill: '#04070c' }, gBg);

  /* arco fino de fundo atrás da velocidade */
  layer = el('g', { mask: 'url(#mSafe)' });
  el('path', { d: arcPath(640, 336, 258, 208, 332), fill: 'none', stroke: '#38cfff', 'stroke-width': 2.5, opacity: 0.45 });
  el('path', { d: arcPath(640, 336, 270, 214, 326), fill: 'none', stroke: '#38cfff', 'stroke-width': 1.2, opacity: 0.2 });

  /* ---------- topo ---------- */
  var clockTxt = txt(24, 34, '', 22, 'num', 'start');
  el('rect', { x: 102, y: 16, width: 1, height: 22, fill: '#2a3d52' });
  var outTxt = txt(118, 34, '', 22, 'dim', 'start');

  /* à direita: odômetro total e o estado EV/HEV */
  txt(1264, 18, 'ODO', 10, 'mut', 'end');
  var odoTxt = txt(1264, 38, '', 19, 'num', 'end');

  /* ---------- aros ---------- */
  var RING_Y = 214, R = 120, LX = 152, RX = W - 152;
  var SWEEP = 268;                /* arco aberto em baixo: nada do aro cai sobre os painéis */
  var A_THR = 135, DIR_THR = 1;   /* esquerda: começa embaixo à esquerda e sobe pelo lado esquerdo */
  var A_POW = 45, DIR_POW = -1;   /* direita: começa embaixo à direita e sobe pelo lado direito */

  function ring(cx, grad, a0, dir) {
    var g = el('g');
    var full = arcPath(cx, RING_Y, R, a0, a0 + dir * SWEEP);
    /* trilha do aro, aro de marcas pontilhadas e o arco de valor */
    el('path', { d: full, fill: 'none', stroke: '#22405c', 'stroke-width': 14, 'stroke-linecap': 'round' }, g);
    /* marcas radiais curtas ao longo do arco */
    var TICKS = 25;
    for (var t = 0; t < TICKS; t++) {
      var ta = a0 + dir * SWEEP * (t / (TICKS - 1));
      var major = t % 6 === 0;
      var p0 = pt(cx, RING_Y, R - 11, ta), p1 = pt(cx, RING_Y, R - (major ? 27 : 20), ta);
      el('line', {
        x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1],
        stroke: major ? '#4d7595' : '#2f4f6c', 'stroke-width': major ? 2.4 : 1.5,
        'stroke-linecap': 'butt', opacity: major ? 0.95 : 0.7
      }, g);
    }
    var glow = el('path', { d: '', fill: 'none', stroke: grad, 'stroke-width': 30, 'stroke-linecap': 'round', opacity: 0.16 }, g);
    var val = el('path', { d: '', fill: 'none', stroke: grad, 'stroke-width': 14, 'stroke-linecap': 'round' }, g);
    return { glow: glow, val: val, cx: cx, a0: a0, dir: dir };
  }
  function setRing(rg, frac) {
    var f = Math.max(0, Math.min(0.9995, frac));   /* 360° exatos não desenham nada em SVG */
    var d = f > 0.004 ? arcPath(rg.cx, RING_Y, R, rg.a0, rg.a0 + rg.dir * SWEEP * f) : '';
    rg.val.setAttribute('d', d);
    rg.glow.setAttribute('d', d);
  }
  var thrRing = ring(LX, 'url(#gThr)', A_THR, DIR_THR);
  var powRing = ring(RX, 'url(#gPow)', A_POW, DIR_POW);

  /* rótulo em cima e valor+unidade centrados como um bloco só dentro do aro */
  var lblThr = txt(LX, 192, T.thr, 19, 'dim');
  lblThr.setAttribute('letter-spacing', '1.2');
  var thrNum = txt(LX, 254, '0', 56, 'num');
  var thrUnit = el('tspan', { 'font-size': 22, class: 'dim', dx: 4 });
  thrUnit.textContent = '%';
  thrNum.appendChild(thrUnit);

  var bolt = el('path', { d: 'M' + (RX - 4) + ' 164 l9 -16 l-2.5 10.5 h8 l-10 17 l2.5 -11.5 z', fill: '#ff9a3c', opacity: 0.9 });
  var lblPow = txt(RX, 192, T.pow, 19, 'dim');
  lblPow.setAttribute('letter-spacing', '1.2');
  var powNum = txt(RX, 254, '0', 56, 'num');
  var powUnit = el('tspan', { 'font-size': 22, class: 'dim', dx: 4 });
  powUnit.textContent = powU();
  powNum.appendChild(powUnit);
  var powLine = el('rect', { x: RX - 58, y: 268, width: 116, height: 2, rx: 1, fill: '#ff9a3c', opacity: 0.85 });
  var powLabel = txt(RX, 286, '', 13, 'mut');
  powLabel.setAttribute('letter-spacing', '1');

  /* ---------- centro: velocidade e caminhonete ---------- */
  var spdNum = txt(640, 136, '0', 100, 'num');
  spdNum.setAttribute('font-weight', 500);
  var kmhTxt = txt(640, 160, T.kmh, 20, 'mut');
  kmhTxt.setAttribute('paint-order', 'stroke');
  kmhTxt.setAttribute('stroke', 'rgba(3,8,16,0.75)');
  kmhTxt.setAttribute('stroke-width', '4');
  kmhTxt.setAttribute('stroke-linejoin', 'round');
  kmhTxt.setAttribute('fill', '#cfe4f6');

  var TRUCK_W = 284, TRUCK_H = Math.round(TRUCK_W * 203 / 400);
  var truckGlow = el('ellipse', { cx: 640, cy: 306, rx: 150, ry: 8, fill: '#2f9df5', opacity: 0.16 });
  el('image', { href: 'assets/truck.png', x: 640 - TRUCK_W / 2, y: 306 - TRUCK_H, width: TRUCK_W, height: TRUCK_H });

  /* paginação decorativa das telas, como no desenho */

  /* ---------- cartões ---------- */
  /* aro neon: halo largo + traço médio + núcleo claro, igual às linhas da imagem de pressão */
  var NEON = '#0480ff';                 /* medida nas linhas da imagem de pressão */
  var NEON_CORE = '#8ac6ff';
  var ICON = '#5ab6ff';
  function neon(parent, x, y, w, h, r, k) {
    var f = k || 1;
    rrect(x, y, w, h, r, { fill: 'none', stroke: NEON, 'stroke-width': 9 * f, opacity: 0.08 }, parent);
    rrect(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 3), { fill: 'none', stroke: NEON_CORE, 'stroke-width': 1, opacity: 0.18 }, parent);
    return rrect(x, y, w, h, r, { fill: 'none', stroke: NEON, 'stroke-width': 1.5 * f, opacity: 0.65 }, parent);
  }
  function card(x, w) {
    var g = el('g');
    rrect(x, 330, w, 136, 18, { fill: 'url(#gCard)' }, g);
    neon(g, x, 330, w, 136, 18, 1);
    return g;
  }
  function batteryIcon(x, y, parent) {
    el('rect', { x: x, y: y, width: 18, height: 28, rx: 4, fill: 'none', stroke: '#38cfff', 'stroke-width': 2 }, parent);
    el('rect', { x: x + 5, y: y - 4, width: 8, height: 4, rx: 1, fill: '#38cfff' }, parent);
    return el('rect', { x: x + 3, y: y + 15, width: 12, height: 10, rx: 2, fill: '#38cfff' }, parent);
  }
  function pumpIcon(x, y, parent) {
    el('rect', { x: x, y: y, width: 15, height: 28, rx: 3, fill: 'none', stroke: ICON, 'stroke-width': 2 }, parent);
    el('path', {
      d: 'M' + (x + 15) + ' ' + (y + 6) + 'h6v10a3.5 3.5 0 0 0 7 0V' + (y + 4),
      fill: 'none', stroke: ICON, 'stroke-width': 2, 'stroke-linecap': 'round'
    }, parent);
    return el('rect', { x: x + 3, y: y + 6, width: 9, height: 7, rx: 1, fill: ICON }, parent);
  }
  /* barra de nível em blocos, como no desenho */
  function segBar(parent, x, y, w, h, n) {
    var gap = 3, sw = (w - gap * (n - 1)) / n, cells = [];
    for (var i = 0; i < n; i++) {
      cells.push(rrect(x + i * (sw + gap), y, sw, h, 2, { fill: '#0e1d2c' }, parent));
    }
    return cells;
  }
  function drawSegBar(cells, frac) {
    var lit = Math.round(Math.max(0, Math.min(1, frac)) * cells.length);
    cells.forEach(function (r, i) {
      r.setAttribute('fill', i < lit ? NEON : '#0e1d2c');
    });
  }
  function mountainIcon(x, y, s, parent) {
    return el('path', {
      d: 'M' + (x - s) + ' ' + (y + s * 0.6) + 'l' + (s * 0.55) + ' ' + (-s * 1.25) + 'l' + (s * 0.35) + ' ' + (s * 0.6) +
         'l' + (s * 0.28) + ' ' + (-s * 0.45) + 'l' + (s * 0.62) + ' ' + (s * 1.1) + 'z',
      fill: '#eaf3ff', opacity: 0.9
    }, parent);
  }

  /* cartão 1: bateria, combustível, autonomia */
  var c1 = card(14, 446);
  batteryIcon(60, 350, c1);
  var batNum = txt(92, 378, '--', 27, 'num', 'start');
  var batUnit = el('tspan', { 'font-size': 14, class: 'mut', dx: 3 });
  batUnit.textContent = '';
  batNum.appendChild(batUnit);
  txt(92, 396, T.bat, 11, 'mut', 'start');
  var batBar = segBar(c1, 60, 410, 148, 7, 10);

  pumpIcon(254, 350, c1);
  var fuelNum = txt(306, 378, '--', 27, 'num', 'start');
  var fuelUnit = el('tspan', { 'font-size': 14, class: 'mut', dx: 3 });
  fuelUnit.textContent = '';
  fuelNum.appendChild(fuelUnit);
  txt(306, 396, T.fuel, 11, 'mut', 'start');
  var fuelBar = segBar(c1, 254, 410, 148, 7, 10);

  el('rect', { x: 231, y: 344, width: 1, height: 58, fill: '#16283c' }, c1);

  /* autonomia numa linha só, centrada no cartão */
  el('rect', { x: 40, y: 428, width: 394, height: 1, fill: '#16283c' }, c1);
  mountainIcon(147, 449, 10, c1);
  var rangeNum = txt(177, 454, '', 22, 'num', 'start');
  txt(258, 454, T.range, 11, 'mut', 'start');

  /* cartão 2: pressões, com o carro visto de cima */
  var c2 = card(470, 340);
  c2.firstChild.setAttribute('fill', '#04090f');
  /* a imagem inteira preenche o cartão; os números ficam em cima, onde as linhas terminam */
  el('image', { id: 'tyrecar', href: 'assets/tyre.jpg', x: 519, y: 330, width: 242, height: 136,
    preserveAspectRatio: 'xMidYMid meet' }, c2);
  var TYRE = [['fl', 590, 366, 'end'], ['fr', 690, 366, 'start'], ['rl', 590, 438, 'end'], ['rr', 690, 438, 'start']];
  var tyreNum = {};
  TYRE.forEach(function (t) {
    var n = txt(t[1], t[2], '--', 17, 'num', t[3]);
    n.setAttribute('paint-order', 'stroke');
    n.setAttribute('stroke', 'rgba(2,6,14,0.8)');
    n.setAttribute('stroke-width', '3.5');
    n.setAttribute('stroke-linejoin', 'round');
    var u = el('tspan', { 'font-size': 10, class: 'mut', dx: 3 });
    u.textContent = '';
    n.appendChild(u);
    tyreNum[t[0]] = { num: n, unit: u };
  });

  /* cartão 3: modo de condução */
  var c3 = card(820, 446);
  neon(c3, 852, 355, 382, 42, 21, 0.85);
  var modeIcon = el('g', { transform: 'translate(978,376)' }, c3);
  /* um ícone por modo: estrada, folha, chevrons, montanha, floco, dunas ou gota */
  function modeGlyph(mode) {
    var m = (mode || '').toUpperCase();
    while (modeIcon.firstChild) modeIcon.removeChild(modeIcon.firstChild);
    function p(d) {
      el('path', {
        d: d, fill: 'none', stroke: '#dff0ff', 'stroke-width': 2,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: 0.92
      }, modeIcon);
    }
    if (/ECO/.test(m)) {
      p('M-9 8C-9 -3 1 -9 10 -9 10 2 1 9 -9 8Z');
      p('M-7 6L2 -1');
    } else if (/SPORT/.test(m)) {
      /* cronômetro: corpo, coroa, botão lateral e ponteiro */
      el('circle', { cx: 0, cy: 1, r: 8, fill: 'none', stroke: '#dff0ff', 'stroke-width': 2 }, modeIcon);
      el('rect', { x: -2.6, y: -10.5, width: 5.2, height: 3.2, rx: 1.2, fill: '#dff0ff' }, modeIcon);
      el('path', { d: 'M-6.6 -6.4L-9 -8.8', stroke: '#dff0ff', 'stroke-width': 2, 'stroke-linecap': 'round' }, modeIcon);
      el('path', { d: 'M0 1L4.6 -3.6', stroke: '#dff0ff', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, modeIcon);
      el('circle', { cx: 0, cy: 1, r: 1.4, fill: '#dff0ff' }, modeIcon);
    } else if (/NIEVE|SNOW/.test(m)) {
      p('M0 -10V10M-9 -5L9 5M9 -5L-9 5');
    } else if (/ARENA|SAND/.test(m)) {
      p('M-11 2Q-5 -6 0 0Q5 6 11 -2');
      p('M-11 8Q-6 2 0 7Q6 12 11 6');
    } else if (/LODO|MUD|BARRO|TIERRA/.test(m)) {
      /* respingo de lama: gota grande e duas menores */
      p('M-1 -10C2 -6 4 -4 4 -1A5 5 0 1 1 -6 -1C-6 -4 -4 -6 -1 -10Z');
      p('M7 2C8.5 4 9.5 5 9.5 6.5A2.5 2.5 0 1 1 4.5 6.5C4.5 5 5.5 4 7 2Z');
      p('M-8 6C-6.8 7.5 -6 8.3 -6 9.4A2 2 0 1 1 -10 9.4C-10 8.3 -9.2 7.5 -8 6Z');
    } else if (/MONTA|HILL|OFF/.test(m)) {
      p('M-11 6L-3 -7L2 1L5 -3L12 6Z');
    } else if (/NORMAL/.test(m)) {
      p('M-7 9L-3 -9M7 9L3 -9M0 -3V3M0 7V9');
    } else {
      p('M-6 6A6 6 0 1 1 6 6A6 6 0 1 1 -6 6Z');
    }
  }
  var modeTxt = txt(1054, 384, '', 20, 'num', null, 500);
  modeTxt.setAttribute('letter-spacing', '1.5');

  /* marcha e tração no mesmo painel dos modos */
  var SEL_ORDER = ['P', 'R', 'N', 'D'], gearCells = [];
  for (var gi = 0; gi < 4; gi++) {
    var gx = 872 + gi * 48;
    el('circle', { cx: gx + 21, cy: 424, r: 16.5, fill: 'none', stroke: NEON, 'stroke-width': 7, opacity: 0.06 }, c3);
    var ringStroke = el('circle', { cx: gx + 21, cy: 424, r: 16.5, fill: 'none', stroke: NEON, 'stroke-width': 1.3, opacity: 0.55 }, c3);
    gearCells.push({
      bg: el('circle', { cx: gx + 21, cy: 424, r: 15, fill: 'rgba(11,24,38,0.9)' }, c3),
      ring: ringStroke,
      tx: txt(gx + 21, 431, SEL_ORDER[gi], 19, 'mut', 'middle', 600, c3)
    });
  }

  var evGlow = rrect(1074, 410, 160, 28, 14, { fill: 'none', stroke: NEON, 'stroke-width': 7, opacity: 0.1 }, c3);
  var evFill = rrect(1076, 412, 156, 24, 12, { fill: 'rgba(4,128,255,0.26)' }, c3);
  var evPill = rrect(1074, 410, 160, 28, 14, { fill: 'none', stroke: NEON, 'stroke-width': 2.2, opacity: 0.75 }, c3);
  var evTxt = txt(1154, 430, '', 15, 'num', null, 600, c3);
  evTxt.setAttribute('letter-spacing', '1.5');

  var warnTxt = txt(240, 34, '', 14, 'or', 'start');

  /* ---------- desenho ---------- */
  function fmt(v, dec) {
    if (v === null || v === undefined || v === -999 || isNaN(v)) return '--';
    return dec ? (+v).toFixed(dec) : String(Math.round(v));
  }
  function pct(v) { return (v === null || v === undefined || v === -999) ? null : Math.max(0, Math.min(100, v)); }

  var MODES = { 1: 'ECO', 2: 'NORMAL', 3: 'SPORT' };

  /* pedal: mesma paleta da potência, só a ponta do aro esquenta conforme o curso */
  function mixRgb(a, b, t) {
    var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
    var r = ((x >> 16) & 255) + (((y >> 16) & 255) - ((x >> 16) & 255)) * t;
    var g = ((x >> 8) & 255) + (((y >> 8) & 255) - ((x >> 8) & 255)) * t;
    var bl = (x & 255) + ((y & 255) - (x & 255)) * t;
    return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(bl) + ')';
  }
  function tintThrottle(f) {
    var heat = Math.max(0, Math.min(1, (f - 0.25) / 0.75));
    thrStop[2].setAttribute('stop-color', mixRgb('#2f9df5', '#ff8a2b', heat));
    thrRing.glow.setAttribute('opacity', (0.12 + 0.3 * f).toFixed(2));
  }

  function draw(d) {
    var kmh = Math.max(0, d.speed || 0);
    spdNum.textContent = String(Math.round(spd(kmh)));

    var tps = Math.max(0, Math.min(100, d.tps || 0));
    thrNum.firstChild.nodeValue = String(Math.round(tps));
    setRing(thrRing, tps / 100);
    tintThrottle(tps / 100);

    /* potência com sinal: negativo quando está regenerando */
    var kw = (d.pw === -999 || d.pw == null) ? 0 : d.pw;
    var p = Math.round(powTo(kw));
    powNum.firstChild.nodeValue = String(p);
    powUnit.textContent = powU();
    setRing(powRing, Math.min(1, Math.abs(kw) / 200));
    var regen = kw < -1;
    var powStroke = regen ? 'url(#gRegen)' : 'url(#gPow)';
    powRing.val.setAttribute('stroke', powStroke);
    powRing.glow.setAttribute('stroke', powStroke);
    powLabel.textContent = regen ? T.regen : (kw < 1 ? '' : T.cons);
    powLabel.setAttribute('class', regen ? 'cy' : 'mut');
    powLine.setAttribute('fill', regen ? '#38cfff' : '#ff9a3c');
    bolt.setAttribute('fill', regen ? '#38cfff' : '#ff9a3c');

    /* o feed manda o modo como texto em `drive` e o código em `dmode` (2 = NORMAL) */
    var mode = (typeof d.drive === 'string' && d.drive) ? d.drive : (MODES[+d.dmode] || '');
    modeTxt.textContent = mode.toUpperCase();
    modeGlyph(mode);

    /* SPORT troca a paisagem por uma cena de estrada em brasa */
    var sport = /SPORT/i.test(mode);
    bgSport.setAttribute('opacity', sport ? '0.92' : '0');
    bgNormal.setAttribute('opacity', sport ? '0' : '1');
    truckGlow.setAttribute('fill', sport ? '#ff7a3c' : '#2f9df5');

    var soc = pct(d.soc);
    batNum.firstChild.nodeValue = soc === null ? '--' : String(Math.round(soc));
    batUnit.textContent = soc === null ? '' : '%';
    drawSegBar(batBar, soc === null ? 0 : soc / 100);

    /* o combustível aparece em km (autonomia): `fuelKm`; se só vier a porcentagem do tanque,
       mostra em % e a barra usa essa porcentagem */
    var fuel = pct(d.fuel);
    var fuelKm = (d.fuelKm == null || d.fuelKm === -999) ? null : d.fuelKm;
    if (fuelKm !== null) {
      fuelNum.firstChild.nodeValue = String(Math.round(dist(fuelKm)));
      fuelUnit.textContent = DIST_U;
    } else {
      fuelNum.firstChild.nodeValue = fuel === null ? '--' : String(Math.round(fuel));
      fuelUnit.textContent = fuel === null ? '' : '%';
    }
    var fuelFrac = fuel !== null ? fuel / 100 : (fuelKm !== null ? Math.min(1, fuelKm / 900) : 0);
    drawSegBar(fuelBar, fuelFrac);

    var rg = (d.range === -999 || d.range == null) ? null : d.range;
    rangeNum.textContent = rg === null ? '--' : (Math.round(dist(rg)) + ' ' + DIST_U);

    /* pressão: o feed pode mandar bar (2.4) ou psi (34) — a unidade acompanha a grandeza */
    var y = d.tyre;
    if (y && y.fl != null) {
      var large = Math.max(+y.fl, +y.fr, +y.rl, +y.rr) > 10;
      TYRE.forEach(function (t) {
        var box = tyreNum[t[0]];
        box.num.firstChild.nodeValue = fmt(y[t[0]], large ? 0 : 1);
        box.unit.textContent = large ? 'PSI' : 'bar';
      });
    }

    /* seletor: a marcha ativa acende */
    var sel = d.sel || 'P';
    gearCells.forEach(function (c, i) {
      var on = SEL_ORDER[i] === sel;
      c.bg.setAttribute('fill', on ? 'rgba(4,128,255,0.3)' : 'rgba(11,24,38,0.9)');
      c.ring.setAttribute('stroke', on ? NEON_CORE : NEON);
      c.ring.setAttribute('opacity', on ? '1' : '0.55');
      c.ring.setAttribute('stroke-width', on ? '2' : '1.3');
      c.tx.setAttribute('class', on ? 'num' : 'mut');
      c.tx.setAttribute('fill', on ? '#eaf7ff' : '#5d7891');
    });

    odoTxt.textContent = (d.odo === -999 || d.odo == null) ? '--' : (Math.round(dist(d.odo)) + ' ' + DIST_U);

    /* EV ou HEV: `ev` do feed; sem ele, o painel não chuta */
    var ev = d.ev;
    if (typeof ev === 'string') ev = /^ev$/i.test(ev) ? 1 : (/hev/i.test(ev) ? 0 : null);
    if (ev === 1 || ev === 0) {
      evTxt.textContent = ev === 1 ? 'EV' : 'HEV';
      var tint = ev === 1 ? NEON : '#ffb020';
      evFill.setAttribute('fill', ev === 1 ? 'rgba(4,128,255,0.26)' : 'rgba(255,176,32,0.22)');
      evFill.setAttribute('opacity', '1');
      evTxt.setAttribute('fill', ev === 1 ? NEON_CORE : '#ffcf80');
      evPill.setAttribute('stroke', tint);
      evGlow.setAttribute('stroke', tint);
      evPill.setAttribute('opacity', '0.85');
      evGlow.setAttribute('opacity', '0.09');
    } else {
      evTxt.textContent = '';
      evPill.setAttribute('opacity', '0');
      evGlow.setAttribute('opacity', '0');
      evFill.setAttribute('opacity', '0');
    }

    var now = new Date();
    clockTxt.textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
    outTxt.textContent = (d.tout === -999 || d.tout == null) ? '' : Math.round(d.tout) + ' °C';

    warnTxt.textContent = (d.warn && d.warn.length) ? d.warn.join('  ') : '';
  }

  window.BrasaDriveUpdate = function (d) { if (d) draw(d); };

  draw({ speed: 0, tps: 0, pw: 0, soc: -999, fuel: -999, range: -999, sel: 'P', tout: -999 });
})();
</script>
</body>
</html>
