<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Muscle Digital</title>
<style>
  html, body { margin: 0; height: 480px; overflow: hidden; background: #05070a; }
  html.panel, html.panel body { background: #05070a; }
  svg { display: block; font-family: "Barlow", Roboto, "Helvetica Neue", Arial, sans-serif; }
  text { fill: #e8eef5; }
  .dim { fill: #7d8b99; }
  .num { fill: #eaf3ff; }
  .accent { fill: #38cfff; }
  .warm { fill: #ffb020; }
  .bad { fill: #ff4b3e; }
  .good { fill: #37e07a; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/*
 * Muscle Digital (SharkLab) — inspirado nos painéis digitais de muscle car: dois mostradores
 * grandes com arco em degradê, velocidade digital no meio, marcha e shift lights.
 * Código próprio, pensado para 1280×480 (a mesma proporção do painel 1920×720).
 */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = 1280, H = 480;
  var svg = document.getElementById('s');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  /* a skin desenha em 1280×480 e é escalada por CSS para o viewport real do painel */
  function fitSkin() {
    var k = Math.min((window.innerWidth || W) / W, (window.innerHeight || H) / H);
    if (!(k > 0)) k = 1;
    document.body.style.position = 'absolute';
    document.body.style.left = '50%';
    document.body.style.top = '50%';
    document.body.style.width = W + 'px';
    document.body.style.height = H + 'px';
    document.body.style.transformOrigin = '50% 50%';
    document.body.style.transform = 'translate(-50%, -50%) scale(' + k.toFixed(4) + ')';
  }
  fitSkin();
  window.addEventListener('resize', fitSkin);

  var LANG = (/[#&]lang=(pt|es|en)/.exec(location.hash) || [])[1] || 'es';
  var T = {
    es: { power: 'POTENCIA', speed: 'km/h', bat: 'BATERÍA', km: 'km', odo: 'TOTAL', trip: 'VIAJE', ready: 'LISTO' },
    pt: { power: 'POTÊNCIA', speed: 'km/h', bat: 'BATERIA', km: 'km', odo: 'TOTAL', trip: 'VIAGEM', ready: 'PRONTO' },
    en: { power: 'POWER', speed: 'mph', bat: 'BATTERY', km: 'mi', odo: 'ODO', trip: 'TRIP', ready: 'READY' }
  }[LANG] || {};

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  }
  function txt(x, y, s, size, cls, anchor, parent) {
    var t = el('text', { x: x, y: y, 'font-size': size, 'text-anchor': anchor || 'middle', class: cls || '' }, parent);
    t.textContent = s;
    return t;
  }
  function pt(cx, cy, r, a) {
    var rad = a * Math.PI / 180;
    return [(cx + r * Math.cos(rad)).toFixed(2), (cy + r * Math.sin(rad)).toFixed(2)];
  }
  function arc(cx, cy, r, a0, a1) {
    if (Math.abs(a1 - a0) < 0.02) return 'M' + cx + ' ' + cy;
    var p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    var big = Math.abs(a1 - a0) > 180 ? 1 : 0;
    return 'M' + p0[0] + ' ' + p0[1] + 'A' + r + ' ' + r + ' 0 ' + big + ' 1 ' + p1[0] + ' ' + p1[1];
  }

  /* degradê dos arcos */
  var defs = el('defs');
  function grad(id, c1, c2) {
    var g = el('linearGradient', { id: id, x1: '0', y1: '1', x2: '1', y2: '0' }, defs);
    el('stop', { offset: '0', 'stop-color': c1 }, g);
    el('stop', { offset: '1', 'stop-color': c2 }, g);
    return 'url(#' + id + ')';
  }
  var gSpeed = grad('gSpeed', '#1b6fa8', '#38cfff');
  var gRpm = grad('gRpm', '#a8381b', '#ff7a3a');

  var A0 = 150, SWEEP = 240;
  var CY = 250;

  /* --- velocímetro (esquerda) --- */
  var spCx = 250, spR = 150;
  el('path', { d: arc(spCx, CY, spR, A0, A0 + SWEEP), fill: 'none', stroke: '#111a24', 'stroke-width': 18, 'stroke-linecap': 'round' });
  var spFill = el('path', { d: '', fill: 'none', stroke: gSpeed, 'stroke-width': 18, 'stroke-linecap': 'round' });
  var spNum = txt(spCx, CY + 18, '0', 96, 'num');
  spNum.setAttribute('font-weight', 500);
  var spUnit = txt(spCx, CY + 58, T.speed, 20, 'dim');
  var gearTxt = txt(spCx, CY + 104, 'P', 30, 'accent');

  /* --- conta-giros / potência (direita) --- */
  var rpCx = W - 250;
  el('path', { d: arc(rpCx, CY, spR, A0, A0 + SWEEP), fill: 'none', stroke: '#111a24', 'stroke-width': 18, 'stroke-linecap': 'round' });
  var rpFill = el('path', { d: '', fill: 'none', stroke: gRpm, 'stroke-width': 18, 'stroke-linecap': 'round' });
  var rpNum = txt(rpCx, CY + 18, '0', 76, 'num');
  var rpUnit = txt(rpCx, CY + 56, T.power, 18, 'dim');
  var batTxt = txt(rpCx, CY + 100, '', 20, 'dim');

  /* --- centro --- */
  var modeTxt = txt(W / 2, 74, '', 20, 'accent');
  var readyTxt = txt(W / 2, 412, T.ready, 16, 'good');
  readyTxt.setAttribute('letter-spacing', '3');

  /* seletor PRND */
  var SEL = ['P', 'R', 'N', 'D'], selEls = [];
  for (var i = 0; i < 4; i++) selEls.push(txt(W / 2 - 54 + i * 36, 372, SEL[i], 24, 'dim'));

  /* shift lights */
  var shift = [];
  for (var k = 0; k < 8; k++) {
    shift.push(el('rect', { x: W / 2 - 92 + k * 24, y: 96, width: 16, height: 6, rx: 3, fill: '#16212c' }));
  }

  /* rodapé */
  var odoTxt = txt(28, H - 18, '', 18, 'dim', 'start');
  var tripTxt = txt(W - 28, H - 18, '', 18, 'dim', 'end');
  var clockTxt = txt(W / 2, H - 18, '', 18, 'dim');

  /* aviso BYD (faixa reservada no alto do meio) */
  var safeBg = el('rect', { x: 427, y: 0, width: 426, height: 54, rx: 10, fill: '#05070a', opacity: 0.9 });

  function fmt(v) { return (v === null || v === undefined || v === -999) ? '--' : String(Math.round(v)); }

  var ev = null, igniteAt = 0;

  function draw(d) {
    ev = d;
    var speed = Math.max(0, d.speed || 0);
    var maxSpd = 220;
    spNum.textContent = String(Math.round(speed));
    spFill.setAttribute('d', arc(spCx, CY, spR, A0, A0 + SWEEP * Math.min(1, speed / maxSpd)));

    var kw = (d.pw === -999 || d.pw == null) ? 0 : d.pw;
    rpNum.textContent = String(Math.abs(Math.round(kw)));
    rpUnit.textContent = T.power;
    var frac = Math.min(1, Math.abs(kw) / 200);
    rpFill.setAttribute('d', arc(rpCx, CY, spR, A0, A0 + SWEEP * frac));
    rpFill.setAttribute('stroke', kw < -1 ? '#37e07a' : gRpm);

    gearTxt.textContent = d.sel || 'P';
    for (var j = 0; j < 4; j++) {
      selEls[j].setAttribute('class', d.sel === SEL[j] ? 'accent' : 'dim');
    }
    modeTxt.textContent = d.drive || '';
    readyTxt.setAttribute('opacity', d.on === false ? 0.2 : 1);

    batTxt.textContent = d.soc >= 0 ? (Math.round(d.soc) + '%  ' + (d.range > -999 ? Math.round(d.range) + ' km' : '')) : '';

    /* shift lights pela potência/giro */
    var lit = Math.round(frac * shift.length);
    for (var s2 = 0; s2 < shift.length; s2++) {
      shift[s2].setAttribute('fill', s2 < lit ? (s2 > 5 ? '#ff4b3e' : s2 > 3 ? '#ffb020' : '#38cfff') : '#16212c');
    }

    odoTxt.textContent = d.odo === -999 ? '' : T.odo + ' ' + fmt(d.odo) + ' km';
    var tkm = d.trip && typeof d.trip.km === 'number' ? d.trip.km : null;
    tripTxt.textContent = tkm === null ? '' : T.trip + ' ' + tkm.toFixed(1) + ' km';

    var now = new Date();
    clockTxt.textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);

    /* arranque: os arcos varrem até o fim e voltam */
    if (igniteAt) {
      var t = (Date.now() - igniteAt) / 900;
      if (t >= 1) { igniteAt = 0; }
      else {
        var k2 = Math.sin(Math.min(1, t) * Math.PI);
        spFill.setAttribute('d', arc(spCx, CY, spR, A0, A0 + SWEEP * k2));
        rpFill.setAttribute('d', arc(rpCx, CY, spR, A0, A0 + SWEEP * k2));
      }
    }
  }

  window.BrasaDriveUpdate = function (d) { if (d) draw(d); };

  /* chamado pela app no ENCENDER */
  window.EvsIgnition = function () { igniteAt = Date.now(); };

  draw({ speed: 0, pw: 0, soc: -1, range: -999, odo: -999, sel: 'P', on: false, drive: '' });
})();
</script>
</body>
</html>
