<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Muscle Digital</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  svg { display: block; font-family: "Barlow", Roboto, "Helvetica Neue", Arial, sans-serif; }
  text { fill: #e8eef5; }
  .dim { fill: #7d8b99; }
  .num { fill: #eaf3ff; }
  .accent { fill: #38cfff; }
  .warm { fill: #ffb020; }
  .bad { fill: #ff4b3e; }
  .good { fill: #37e07a; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 720" preserveAspectRatio="xMidYMid meet"></svg>
<script>
/*
 * Muscle Digital (SharkLab) — desenhado NATIVAMENTE em 1920×720, o tamanho exacto do painel.
 * Sem escala, sem meta viewport: o que aparece aqui é pixel a pixel o quadro do clúster.
 * Inspirado nos painéis digitais de muscle car (dois arcos em degradê, velocidade grande,
 * marcha, shift lights), com código próprio.
 */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = 1920, H = 720;
  var svg = document.getElementById('s');

  var LANG = (/[#&]lang=(pt|es|en)/.exec(location.hash) || [])[1] || 'es';
  var T = ({
    es: { power: 'POTENCIA', speed: 'km/h', bat: 'BATERÍA', km: 'km', odo: 'TOTAL', trip: 'VIAJE', ready: 'LISTO' },
    pt: { power: 'POTÊNCIA', speed: 'km/h', bat: 'BATERIA', km: 'km', odo: 'TOTAL', trip: 'VIAGEM', ready: 'PRONTO' },
    en: { power: 'POWER', speed: 'mph', bat: 'BATTERY', km: 'mi', odo: 'ODO', trip: 'TRIP', ready: 'READY' }
  })[LANG] || {};

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  }
  function txt(x, y, s, size, cls, anchor) {
    var t = el('text', { x: x, y: y, 'font-size': size, 'text-anchor': anchor || 'middle', class: cls || '' });
    t.textContent = s;
    return t;
  }
  function pt(cx, cy, r, a) {
    var rad = a * Math.PI / 180;
    return [(cx + r * Math.cos(rad)).toFixed(2), (cy + r * Math.sin(rad)).toFixed(2)];
  }
  function arc(cx, cy, r, a0, a1) {
    if (Math.abs(a1 - a0) < 0.02) return 'M' + cx + ' ' + cy;
    var p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    var big = Math.abs(a1 - a0) > 180 ? 1 : 0;
    return 'M' + p0[0] + ' ' + p0[1] + 'A' + r + ' ' + r + ' 0 ' + big + ' 1 ' + p1[0] + ' ' + p1[1];
  }

  var defs = el('defs');
  function grad(id, c1, c2) {
    var g = el('linearGradient', { id: id, x1: '0', y1: '1', x2: '1', y2: '0' }, defs);
    el('stop', { offset: '0', 'stop-color': c1 }, g);
    el('stop', { offset: '1', 'stop-color': c2 }, g);
    return 'url(#' + id + ')';
  }
  var gSpeed = grad('gSpeed', '#1b6fa8', '#38cfff');
  var gRpm = grad('gRpm', '#a8381b', '#ff7a3a');

  /* fundo contínuo: garante que não aparece nada da BYD por trás */
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#05070a' });

  var A0 = 150, SWEEP = 240;
  var CY = 375, R = 215;          /* raio dos aros */
  var SPX = 360, RPX = W - 360;   /* centros */

  /* velocímetro (esquerda) */
  el('path', { d: arc(SPX, CY, R, A0, A0 + SWEEP), fill: 'none', stroke: '#111a24', 'stroke-width': 26, 'stroke-linecap': 'round' });
  var spFill = el('path', { d: '', fill: 'none', stroke: gSpeed, 'stroke-width': 26, 'stroke-linecap': 'round' });
  var spNum = txt(SPX, CY + 26, '0', 140, 'num');
  spNum.setAttribute('font-weight', 500);
  var spUnit = txt(SPX, CY + 82, T.speed, 28, 'dim');
  var gearTxt = txt(SPX, CY + 150, 'P', 44, 'accent');

  /* potência (direita) */
  el('path', { d: arc(RPX, CY, R, A0, A0 + SWEEP), fill: 'none', stroke: '#111a24', 'stroke-width': 26, 'stroke-linecap': 'round' });
  var rpFill = el('path', { d: '', fill: 'none', stroke: gRpm, 'stroke-width': 26, 'stroke-linecap': 'round' });
  var rpNum = txt(RPX, CY + 26, '0', 112, 'num');
  var rpUnit = txt(RPX, CY + 80, T.power, 26, 'dim');
  var batTxt = txt(RPX, CY + 146, '', 28, 'dim');

  /* centro */
  var modeTxt = txt(W / 2, 108, '', 28, 'accent');
  var readyTxt = txt(W / 2, 618, T.ready, 22, 'good');
  readyTxt.setAttribute('letter-spacing', '4');

  var SEL = ['P', 'R', 'N', 'D'], selEls = [];
  for (var i = 0; i < 4; i++) selEls.push(txt(W / 2 - 81 + i * 54, 558, SEL[i], 36, 'dim'));

  /* shift lights */
  var shift = [];
  for (var k = 0; k < 8; k++) {
    shift.push(el('rect', { x: W / 2 - 138 + k * 36, y: 144, width: 24, height: 9, rx: 4, fill: '#16212c' }));
  }

  /* pedal */
  el('rect', { x: W / 2 - 210, y: 648, width: 420, height: 8, rx: 4, fill: '#16212c' });
  var pedalFill = el('rect', { x: W / 2 - 210, y: 648, width: 0, height: 8, rx: 4, fill: '#38cfff' });
  var pedalTxt = txt(W / 2, 638, '', 18, 'dim');

  /* rodapé */
  var odoTxt = txt(42, H - 26, '', 26, 'dim', 'start');
  var tripTxt = txt(W - 42, H - 26, '', 26, 'dim', 'end');
  var clockTxt = txt(W / 2, H - 26, '', 26, 'dim');

  /* faixa reservada às luzes da BYD (x 640–1280, y 0–81 em 1920×720) */
  el('rect', { x: 640, y: 0, width: 640, height: 81, rx: 14, fill: '#05070a' });

  function fmt(v) { return (v === null || v === undefined || v === -999) ? '--' : String(Math.round(v)); }

  var igniteAt = 0;

  function draw(d) {
    var speed = Math.max(0, d.speed || 0);
    spNum.textContent = String(Math.round(speed));
    spFill.setAttribute('d', arc(SPX, CY, R, A0, A0 + SWEEP * Math.min(1, speed / 220)));

    var kw = (d.pw === -999 || d.pw == null) ? 0 : d.pw;
    rpNum.textContent = String(Math.abs(Math.round(kw)));
    rpUnit.textContent = (kw < -1 ? 'REGEN ' + T.power : T.power);
    var frac = Math.min(1, Math.abs(kw) / 200);
    rpFill.setAttribute('d', arc(RPX, CY, R, A0, A0 + SWEEP * frac));
    rpFill.setAttribute('stroke', kw < -1 ? '#37e07a' : gRpm);

    gearTxt.textContent = d.sel || 'P';
    for (var j = 0; j < 4; j++) selEls[j].setAttribute('class', d.sel === SEL[j] ? 'accent' : 'dim');
    modeTxt.textContent = d.drive || '';
    readyTxt.setAttribute('opacity', d.on === false ? 0.25 : 1);
    batTxt.textContent = d.soc >= 0 ? (Math.round(d.soc) + '%   ' + (d.range > -999 ? Math.round(d.range) + ' km' : '')) : '';

    var lit = Math.round(frac * shift.length);
    for (var s2 = 0; s2 < shift.length; s2++) {
      shift[s2].setAttribute('fill', s2 < lit ? (s2 > 5 ? '#ff4b3e' : s2 > 3 ? '#ffb020' : '#38cfff') : '#16212c');
    }

    var tps = Math.max(0, Math.min(100, d.tps || 0));
    pedalFill.setAttribute('width', (420 * tps / 100).toFixed(0));
    pedalTxt.textContent = tps > 0 ? Math.round(tps) + '%' : '';

    odoTxt.textContent = d.odo === -999 ? '' : T.odo + ' ' + fmt(d.odo) + ' km';
    var tkm = d.trip && typeof d.trip.km === 'number' ? d.trip.km : null;
    tripTxt.textContent = tkm === null ? '' : T.trip + ' ' + tkm.toFixed(1) + ' km';

    var now = new Date();
    clockTxt.textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);

    if (igniteAt) {
      var t = (Date.now() - igniteAt) / 900;
      if (t >= 1) igniteAt = 0;
      else {
        var k2 = Math.sin(Math.min(1, t) * Math.PI);
        spFill.setAttribute('d', arc(SPX, CY, R, A0, A0 + SWEEP * k2));
        rpFill.setAttribute('d', arc(RPX, CY, R, A0, A0 + SWEEP * k2));
      }
    }
  }

  window.BrasaDriveUpdate = function (d) { if (d) draw(d); };
  window.EvsIgnition = function () { igniteAt = Date.now(); };

  draw({ speed: 0, pw: 0, soc: -1, range: -999, odo: -999, sel: 'P', on: false, drive: '', tps: 0 });
})();
</script>
</body>
</html>
